version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      actions-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
      actions-runner-majors:
        patterns: ["actions/checkout", "actions/setup-node"]
        update-types: [major]

  - package-ecosystem: npm
    directories: [/service, /web]
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      npm-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
