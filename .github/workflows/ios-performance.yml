name: One pinned toolchain qualification (not release acceptance)

# Diagnostic ref only. Reuses the already registered workflow path.
# No PR/push/workflow_call triggers, arbitrary selectors, environment input, or retries.
"on":
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-toolchain-qualification-${{ github.ref }}
  cancel-in-progress: false

env:
  DEVELOPER_DIR: /Applications/Xcode_26.4.1.app/Contents/Developer

jobs:
  build:
    name: Freeze original Debug and optimized Release products
    runs-on: macos-26
    timeout-minutes: 90
    outputs:
      products: ${{ steps.products.outputs['artifact-id'] }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check fixed qualification guards and existing validators
        run: |
          python3 scripts/test_qualify_ios_toolchain.py
          python3 scripts/test_plan_ios_performance_tests.py
          python3 scripts/test_check_ios_performance.py
          python3 scripts/test_check_ios_test_results.py
          python3 scripts/test_ui_automation_contract.py
      - name: Require exact toolchain and boot owned build destination
        timeout-minutes: 8
        run: python3 scripts/qualify_ios_toolchain.py prepare build
      - name: Build unmodified Debug products
        timeout-minutes: 35
        run: bash scripts/run_ios_toolchain_qualification.sh build-debug
      - name: Build unmodified optimized Release products
        timeout-minutes: 35
        run: bash scripts/run_ios_toolchain_qualification.sh build-release
      - name: Validate complete compiled inventories and freeze source/products
        timeout-minutes: 10
        run: bash scripts/run_ios_toolchain_qualification.sh inventory
      - name: Package frozen products and inventory proofs
        run: bash scripts/run_ios_toolchain_qualification.sh package
      - name: Retain frozen build products for the three fixed invocations
        id: products
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: qualification-products-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/qualification-products.tar.gz
            ${{ runner.temp }}/qualification-inputs.tar.gz
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Remove only this job's owned simulator
        if: always()
        timeout-minutes: 6
        run: python3 scripts/qualify_ios_toolchain.py cleanup
      - name: Retain build provenance and inventory evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: qualification-build-evidence-${{ github.run_attempt }}
          path: .build/toolchain-qualification
          if-no-files-found: error
          retention-days: 7

  qualification:
    name: Qualification only — ${{ matrix.case }}
    needs: build
    runs-on: macos-26
    timeout-minutes: 55
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - case: ui06
            execution_minutes: 40
          - case: spanish
            execution_minutes: 40
          - case: scroll
            execution_minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.build.outputs.products }}
          path: ${{ runner.temp }}
          merge-multiple: true
      - name: Restore and verify immutable source/products
        run: bash scripts/run_ios_toolchain_qualification.sh restore
      - name: Require exact runtime and fresh owned iPhone 17
        timeout-minutes: 8
        run: python3 scripts/qualify_ios_toolchain.py prepare '${{ matrix.case }}'
      - name: Execute once and validate all original assertions and structural evidence
        timeout-minutes: ${{ matrix.execution_minutes }}
        run: bash scripts/run_ios_toolchain_qualification.sh run '${{ matrix.case }}'
      - name: State the acceptance boundary
        if: always()
        run: |
          echo 'Qualification observations only; releaseAcceptance=false.' >> "$GITHUB_STEP_SUMMARY"
          echo 'The new performance environment has no approved baseline. A pass is one nonreproduction, not a fix or release acceptance.' >> "$GITHUB_STEP_SUMMARY"
      - name: Remove only this job's owned simulator
        if: always()
        timeout-minutes: 6
        run: python3 scripts/qualify_ios_toolchain.py cleanup
      - name: Retain fictional test evidence (no raw Records export)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: qualification-${{ matrix.case }}-${{ github.run_attempt }}
          path: .build/toolchain-qualification
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
