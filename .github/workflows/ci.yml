name: Bitrise recovery canary
run-name: Bitrise recovery · one M4 runner and cache
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ritc-bitrise-recovery-canary
  cancel-in-progress: false
jobs:
  recovery:
    runs-on: 'bitrise-runner-ci 2'
    timeout-minutes: 10
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout: scripts
      - name: Verify the recovered M4 environment
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = self-hosted
          test "$(uname -m)" = arm64
          test "$(uname -s)" = Darwin
          bitrise_xcode=/Applications/Xcode-27.1.0.app/Contents/Developer
          test -d "$bitrise_xcode"
          test "$(DEVELOPER_DIR="$bitrise_xcode" xcodebuild -version)" = $'Xcode 27.1\nBuild version 27A9275'
          if [ ! -e /Applications/Xcode_27.1.app ]; then
            sudo ln -s /Applications/Xcode-27.1.0.app /Applications/Xcode_27.1.app
          fi
          bash scripts/check_ci_xcode27.sh
      - name: Activate the existing pinned Xcode cache integration
        timeout-minutes: 3
        run: bash scripts/activate_bitrise_xcode_cache.sh
      - name: Create a non-sensitive cache marker
        run: |
          mkdir -p "$RUNNER_TEMP/ritc-cache-canary"
          printf '%s\n' 'room-in-the-cart-recovery-check' > "$RUNNER_TEMP/ritc-cache-canary/marker.txt"
      - name: Save through the configured cache backend
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/ritc-cache-canary
          key: ritc-bitrise-recovery-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Remove only the disposable local marker
        run: rm "$RUNNER_TEMP/ritc-cache-canary/marker.txt"
      - name: Restore the same cache entry
        id: restored
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/ritc-cache-canary
          key: ritc-bitrise-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          fail-on-cache-miss: true
      - name: Verify cache readback
        env:
          CACHE_HIT: ${{ steps.restored.outputs.cache-hit }}
        run: |
          test "$CACHE_HIT" = true
          test "$(cat "$RUNNER_TEMP/ritc-cache-canary/marker.txt")" = room-in-the-cart-recovery-check
