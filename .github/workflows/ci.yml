# ISOLATED CACHE-FREE BUILD PROBE: never merge this workflow into normal CI.
name: CI
run-name: Bitrise uncached iOS app build
'on':
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: ritc-bitrise-recovery-canary
  cancel-in-progress: false
jobs:
  uncached-build:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'palatis3/room-in-the-cart' && github.ref == 'refs/heads/codex/bitrise-uncached-build-nov16'
    runs-on: 'bitrise-runner-ci 2'
    timeout-minutes: 25
    env:
      DEVELOPER_DIR: /Applications/Xcode-27.1.0.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout: ios
      - name: Verify the uncached build environment
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = self-hosted
          test "$(uname -m)" = arm64
          test "$(uname -s)" = Darwin
          test "$("$DEVELOPER_DIR/usr/bin/xcodebuild" -version)" = $'Xcode 27.1\nBuild version 27A9275'
          mkdir -p .build/uncached-build
          git rev-parse HEAD > .build/uncached-build/source.txt
          "$DEVELOPER_DIR/usr/bin/xcodebuild" -version > .build/uncached-build/xcode.txt
          sw_vers > .build/uncached-build/macos.txt
          build_dir=$(mktemp -d "$RUNNER_TEMP/ritc-uncached-derived.XXXXXX")
          printf 'RITC_UNCACHED_DERIVED=%s\n' "$build_dir" >> "$GITHUB_ENV"
          printf '%s\n' 'No cache restore/save or activation steps; direct Xcode executable; fresh DerivedData; compiler CAS disabled.' > .build/uncached-build/cache-policy.txt
      - name: Build the iOS app without compilation cache
        timeout-minutes: 20
        shell: bash
        run: |
          set -euo pipefail
          "$DEVELOPER_DIR/usr/bin/xcodebuild" \
            -project ios/RoomInTheCart.xcodeproj -scheme RoomInTheCart \
            -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RITC_UNCACHED_DERIVED" -jobs 2 \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO \
            COMPILATION_CACHE_ENABLE_CACHING=NO build \
            2>&1 | tee .build/uncached-build/build.log
          app="$RITC_UNCACHED_DERIVED/Build/Products/Debug-iphonesimulator/RoomInTheCart.app"
          test -f "$app/RoomInTheCart"
          /usr/bin/file "$app/RoomInTheCart" > .build/uncached-build/product.txt
          /usr/bin/shasum -a 256 "$app/RoomInTheCart" >> .build/uncached-build/product.txt
      - name: Retain uncached build evidence
        if: always()
        timeout-minutes: 2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bitrise-uncached-build-${{ github.run_attempt }}
          path: .build/uncached-build
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: warn
