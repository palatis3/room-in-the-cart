name: Build and test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      require_release_metadata:
        description: Reject missing production support, policy and Apple product metadata
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: core-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  typescript:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        package: [web, service]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: ${{ matrix.package }}/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: ${{ matrix.package }}
      - run: npm test
        working-directory: ${{ matrix.package }}
  service-postgres:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: fixture-only
          POSTGRES_DB: ritc_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ritc_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_ADMIN_DATABASE_URL: postgresql://postgres:fixture-only@127.0.0.1:5432/ritc_test
      MIGRATION_DATABASE_URL: postgresql://postgres:fixture-only@127.0.0.1:5432/ritc_test
      TEST_DATABASE_URL: postgresql://ritc_runtime:fixture-only@127.0.0.1:5432/ritc_test
      TEST_WORKER_DATABASE_URL: postgresql://ritc_test_worker:fixture-only@127.0.0.1:5432/ritc_test
      BILLING_TEST_ADMIN_DATABASE_URL: postgresql://postgres:fixture-only@127.0.0.1:5432/ritc_test
      BILLING_TEST_DATABASE_URL: postgresql://ritc_runtime:fixture-only@127.0.0.1:5432/ritc_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: service/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: service
      - name: Build the web client for the PostgreSQL browser retry tests
        run: npm ci --ignore-scripts && npm run build
        working-directory: web
      - name: Prepare disposable provider-session and maintenance fixtures
        run: |
          psql "$TEST_ADMIN_DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          CREATE SCHEMA auth;
          CREATE TABLE auth.users(id uuid PRIMARY KEY, email text, email_confirmed_at timestamptz);
          CREATE TABLE auth.sessions(id uuid PRIMARY KEY, user_id uuid NOT NULL, not_after timestamptz);
          SQL
          psql "$TEST_ADMIN_DATABASE_URL" -v ON_ERROR_STOP=1 -c 'CREATE DATABASE ritc_operations'
      - run: npm run migrate
        working-directory: service
      - name: Create restricted app, guardian verification and worker roles
        run: |
          psql "$TEST_ADMIN_DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE ritc_runtime LOGIN PASSWORD 'fixture-only' NOSUPERUSER NOBYPASSRLS;
          GRANT ritc_app TO ritc_runtime;
          CREATE ROLE ritc_guardian_test_verifier LOGIN PASSWORD 'fixture-only' NOSUPERUSER NOBYPASSRLS;
          GRANT ritc_guardian_verifier TO ritc_guardian_test_verifier;
          CREATE ROLE ritc_test_worker LOGIN PASSWORD 'fixture-only' NOSUPERUSER NOBYPASSRLS;
          GRANT ritc_worker TO ritc_test_worker;
          -- Negative readiness fixture. A verifier must reject this combined identity.
          CREATE ROLE ritc_guardian_combined_worker LOGIN PASSWORD 'fixture-only' NOSUPERUSER NOBYPASSRLS;
          GRANT ritc_guardian_verifier, ritc_worker TO ritc_guardian_combined_worker;
          SQL
      - run: npm test && npm run test:integration
        working-directory: service
        env:
          RITC_TEST_WEB_WIRE: "1"
      - name: Verify maintenance with a separate database and worker role
        run: node scripts/test-operations.mjs
        working-directory: service
        env:
          OPERATIONS_TEST_DATABASE_URL: postgresql://ritc_runtime:fixture-only@127.0.0.1:5432/ritc_operations
          OPERATIONS_TEST_ADMIN_DATABASE_URL: postgresql://postgres:fixture-only@127.0.0.1:5432/ritc_operations
          TEST_WORKER_DATABASE_URL: postgresql://ritc_test_worker:fixture-only@127.0.0.1:5432/ritc_operations
  source-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate workflow syntax and expression references
        shell: bash
        run: |
          lint_dir="$RUNNER_TEMP/actionlint"
          mkdir -p "$lint_dir"
          curl --fail --silent --show-error --location \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$lint_dir/actionlint.tar.gz"
          echo '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tar.gz' \
            | (cd "$lint_dir" && sha256sum --check)
          tar -xzf "$lint_dir/actionlint.tar.gz" -C "$lint_dir" actionlint
          "$lint_dir/actionlint" -shellcheck='' -pyflakes='' .github/workflows/*.yml
      - name: Validate generated files, localization and CI test selection
        run: |
          python3 scripts/generate_theme.py --check
          python3 scripts/check_localization.py
          python3 scripts/test_check_localization.py
          python3 scripts/test_app_configuration.py
          python3 scripts/generate_xcode_project.py --check
          python3 scripts/test_plan_ios_tests.py
          python3 scripts/test_plan_ios_fixture_tests.py
          python3 scripts/test_plan_ios_performance_tests.py
          python3 scripts/test_check_ios_test_results.py
          python3 scripts/test_check_release_code_scanning.py
          python3 scripts/test_check_ios_performance.py
          bash -n scripts/run_ios_test_shard.sh
  swift-packages:
    runs-on: macos-15
    timeout-minutes: 25
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Test Swift packages and collect coverage
        run: |
          set -o pipefail
          mkdir -p .build/package-results
          for manifest in ios/Packages/*/Package.swift; do
            package="$(dirname "$manifest")"
            swift test --package-path "$package" --enable-code-coverage 2>&1 | tee ".build/package-results/$(basename "$package").log"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: swift-package-results-${{ github.run_attempt }}
          include-hidden-files: true
          path: |
            .build/package-results
            ios/Packages/**/.build/**/codecov/*.json
          retention-days: 7
  ios-release:
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
      actions: read
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      REQUIRE_RELEASE_METADATA: ${{ inputs.require_release_metadata }}
    steps:
      - uses: actions/checkout@v4
      - name: Initialize Swift security analysis
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: swift
          build-mode: manual
      - name: Compile unsigned Release for iPhone
        timeout-minutes: 30
        shell: bash
        run: |
          mkdir -p .build
          # GitHub's Swift extraction guidance requires uncached compilation and the legacy driver.
          # https://docs.github.com/en/code-security/tutorials/customize-code-scanning/prepare-code-for-analysis
          xcodebuild -project ios/RoomInTheCart.xcodeproj -scheme RoomInTheCart-Release \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -jobs 2 -derivedDataPath .build/ReleaseDerivedData ARCHS=arm64 \
            CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            COMPILATION_CACHE_ENABLE_CACHING=NO SWIFT_ENABLE_COMPILE_CACHE=NO \
            SWIFT_USE_INTEGRATED_DRIVER=NO build 2>&1 | tee .build/ReleaseBuild.log
      - name: Verify the compiled iPhone app and embedded extensions
        shell: bash
        run: |
          args=(--configuration Release)
          if [[ "$REQUIRE_RELEASE_METADATA" == true ]]; then
            args+=(--require-release-metadata)
          fi
          python3 scripts/check_built_app.py .build/ReleaseDerivedData/Build/Products/Release-iphoneos/RoomInTheCart.app "${args[@]}"
      - name: Analyze Swift security findings
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:swift
      - name: Retain Release compilation log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iphone-release-build-log-${{ github.run_attempt }}
          path: .build/ReleaseBuild.log
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: ignore
  ios-build:
    runs-on: macos-15
    timeout-minutes: 35
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    outputs:
      test_products_artifact: ${{ steps.upload.outputs['artifact-id'] }}
      test_matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - name: Record toolchain and select iPhone
        run: |
          xcodebuild -version
          swift --version
          xcrun simctl list devices available -j | python3 scripts/select_ci_iphone.py
      - name: Build iPhone simulator test products once
        run: >-
          xcodebuild -project ios/RoomInTheCart.xcodeproj -scheme RoomInTheCart
          -configuration Debug -destination "platform=iOS Simulator,id=$SIMULATOR_ID"
          -jobs 2 -derivedDataPath .build/DerivedData CODE_SIGN_IDENTITY=- build-for-testing
      - name: Verify the compiled simulator app
        run: python3 scripts/check_built_app.py .build/DerivedData/Build/Products/Debug-iphonesimulator/RoomInTheCart.app --configuration Debug
      - name: Discover compiled tests and balance UI groups
        id: plan
        shell: bash
        run: |
          test_runs=(.build/DerivedData/Build/Products/RoomInTheCart_iphonesimulator*.xctestrun)
          test "${#test_runs[@]}" -eq 1
          xcrun simctl bootstatus "$SIMULATOR_ID" -b
          xcodebuild -xctestrun "${test_runs[0]}" \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" -parallel-testing-enabled NO \
            -enumerate-tests -test-enumeration-style flat -test-enumeration-format json \
            -test-enumeration-output-path "$PWD/.build/test-enumeration.json" test-without-building
          python3 scripts/plan_ios_tests.py --enumeration .build/test-enumeration.json --output-dir .build/test-plan --ui-shards 10
          python3 -c 'import json; from pathlib import Path; p=json.loads(Path(".build/test-plan/manifest.json").read_text()); print("matrix=" + json.dumps({"include":p["include"]}))' >> "$GITHUB_OUTPUT"
      - name: Package test products and exact selection
        run: |
          cp .build/test-enumeration.json .build/test-plan/
          tar -czf "$RUNNER_TEMP/iphone-test-products.tar.gz" -C .build/DerivedData/Build Products -C "$GITHUB_WORKSPACE/.build" test-plan
      - uses: actions/upload-artifact@v4
        id: upload
        with:
          name: iphone-test-products-${{ github.run_attempt }}
          path: ${{ runner.temp }}/iphone-test-products.tar.gz
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
  ios-tests:
    needs: ios-build
    runs-on: macos-15
    timeout-minutes: 55
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix: ${{ fromJSON(needs.ios-build.outputs.test_matrix) }}
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      TEST_SHARD: ${{ matrix.shard }}
      EXPECTED_TEST_COUNT: ${{ matrix.expected_count }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.ios-build.outputs.test_products_artifact }}
          path: .build/download
          merge-multiple: true
      - name: Restore iPhone test products and selection
        run: |
          mkdir -p .build/DerivedData/Build
          tar -xzf .build/download/iphone-test-products.tar.gz -C .build/DerivedData/Build
          mv .build/DerivedData/Build/test-plan .build/test-plan
      - name: Select and boot iPhone simulator
        timeout-minutes: 8
        run: |
          xcrun simctl list devices available -j | python3 scripts/select_ci_iphone.py
      - name: Wait for simulator boot
        timeout-minutes: 8
        run: xcrun simctl bootstatus "$SIMULATOR_ID" -b
      - name: Run selected tests and verify complete execution
        timeout-minutes: 40
        run: bash scripts/run_ios_test_shard.sh
      - name: Retain result bundles, screenshots, logs and timing
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iphone-results-${{ matrix.shard }}-${{ github.run_attempt }}
          include-hidden-files: true
          path: |
            .build/Tests*.xcresult
            .build/Tests*.log
            .build/test-*.json
            .build/test-plan/
          retention-days: 7
          if-no-files-found: ignore
  ci-gate:
    name: CI gate
    needs: [typescript, service-postgres, source-checks, swift-packages, ios-release, ios-build, ios-tests]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      JOB_RESULTS: ${{ toJSON(needs) }}
    steps:
      - name: Require every build and test job to succeed
        run: |
          python3 - <<'PY'
          import json, os
          jobs = json.loads(os.environ["JOB_RESULTS"])
          failures = {name: job["result"] for name, job in jobs.items() if job["result"] != "success"}
          if failures:
              raise SystemExit(f"Required jobs did not pass: {failures}")
          print("Every required build and test job passed.")
          PY
