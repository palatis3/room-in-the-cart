name: Build and test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  typescript:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        package: [web, service]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: ${{ matrix.package }}/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: ${{ matrix.package }}
      - run: npm test
        working-directory: ${{ matrix.package }}
  service-postgres:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: fixture-only
          POSTGRES_DB: ritc_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ritc_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_ADMIN_DATABASE_URL: postgresql://postgres:fixture-only@127.0.0.1:5432/ritc_test
      MIGRATION_DATABASE_URL: postgresql://postgres:fixture-only@127.0.0.1:5432/ritc_test
      TEST_DATABASE_URL: postgresql://ritc_runtime:fixture-only@127.0.0.1:5432/ritc_test
      TEST_WORKER_DATABASE_URL: postgresql://ritc_test_worker:fixture-only@127.0.0.1:5432/ritc_test
      BILLING_TEST_ADMIN_DATABASE_URL: postgresql://postgres:fixture-only@127.0.0.1:5432/ritc_test
      BILLING_TEST_DATABASE_URL: postgresql://ritc_runtime:fixture-only@127.0.0.1:5432/ritc_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: service/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: service
      - name: Build the web client for the PostgreSQL browser retry tests
        run: npm ci --ignore-scripts && npm run build
        working-directory: web
      - name: Prepare disposable provider-session and maintenance fixtures
        run: |
          psql "$TEST_ADMIN_DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          CREATE SCHEMA auth;
          CREATE TABLE auth.users(id uuid PRIMARY KEY, email text, email_confirmed_at timestamptz);
          CREATE TABLE auth.sessions(id uuid PRIMARY KEY, user_id uuid NOT NULL, not_after timestamptz);
          SQL
          psql "$TEST_ADMIN_DATABASE_URL" -v ON_ERROR_STOP=1 -c 'CREATE DATABASE ritc_operations'
      - run: npm run migrate
        working-directory: service
      - name: Create restricted app, guardian verification and worker roles
        run: |
          psql "$TEST_ADMIN_DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE ritc_runtime LOGIN PASSWORD 'fixture-only' NOSUPERUSER NOBYPASSRLS;
          GRANT ritc_app TO ritc_runtime;
          CREATE ROLE ritc_guardian_test_verifier LOGIN PASSWORD 'fixture-only' NOSUPERUSER NOBYPASSRLS;
          GRANT ritc_guardian_verifier TO ritc_guardian_test_verifier;
          CREATE ROLE ritc_test_worker LOGIN PASSWORD 'fixture-only' NOSUPERUSER NOBYPASSRLS;
          GRANT ritc_worker TO ritc_test_worker;
          -- Negative readiness fixture. A verifier must reject this combined identity.
          CREATE ROLE ritc_guardian_combined_worker LOGIN PASSWORD 'fixture-only' NOSUPERUSER NOBYPASSRLS;
          GRANT ritc_guardian_verifier, ritc_worker TO ritc_guardian_combined_worker;
          SQL
      - run: npm test && npm run test:integration
        working-directory: service
        env:
          RITC_TEST_WEB_WIRE: "1"
      - name: Verify maintenance with a separate database and worker role
        run: node scripts/test-operations.mjs
        working-directory: service
        env:
          OPERATIONS_TEST_DATABASE_URL: postgresql://ritc_runtime:fixture-only@127.0.0.1:5432/ritc_operations
          OPERATIONS_TEST_ADMIN_DATABASE_URL: postgresql://postgres:fixture-only@127.0.0.1:5432/ritc_operations
          TEST_WORKER_DATABASE_URL: postgresql://ritc_test_worker:fixture-only@127.0.0.1:5432/ritc_operations
  ios:
    runs-on: macos-15-intel
    timeout-minutes: 100
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    outputs:
      test_products_artifact: ${{ steps.upload_ios_products.outputs['artifact-id'] }}
    steps:
      - uses: actions/checkout@v4
      - name: Record toolchain
        run: |
          xcodebuild -version
          swift --version
          python3 --version
      - name: Check generated sources
        run: |
          python3 scripts/generate_theme.py --check
          python3 scripts/check_localization.py
          python3 scripts/test_check_localization.py
          python3 scripts/test_app_configuration.py
          python3 scripts/generate_xcode_project.py --check
      - name: Swift package tests
        run: |
          for manifest in ios/Packages/*/Package.swift; do
            swift test --package-path "$(dirname "$manifest")"
          done
      - name: Select available iPhone simulator
        run: xcrun simctl list devices available -j | python3 scripts/select_ci_iphone.py
      - name: Build iPhone simulator test products
        id: build_ios_tests
        run: >-
          xcodebuild -project ios/RoomInTheCart.xcodeproj -scheme RoomInTheCart
          -configuration Debug -destination "platform=iOS Simulator,id=$SIMULATOR_ID"
          -derivedDataPath .build/DerivedData CODE_SIGN_IDENTITY=- build-for-testing
      - name: Compile unsigned Release for iPhone
        run: >-
          xcodebuild -project ios/RoomInTheCart.xcodeproj -scheme RoomInTheCart-Release
          -configuration Release -sdk iphoneos -destination 'generic/platform=iOS'
          -derivedDataPath .build/ReleaseDerivedData CODE_SIGNING_ALLOWED=NO build
      - name: Verify compiled app configuration
        run: |
          python3 scripts/check_built_app.py .build/DerivedData/Build/Products/Debug-iphonesimulator/RoomInTheCart.app --configuration Debug
          python3 scripts/check_built_app.py .build/ReleaseDerivedData/Build/Products/Release-iphoneos/RoomInTheCart.app --configuration Release
      - name: Package iPhone test products
        id: package_ios_products
        if: ${{ !cancelled() && steps.build_ios_tests.outcome == 'success' }}
        run: tar -czf "$RUNNER_TEMP/iphone-test-products.tar.gz" -C .build/DerivedData/Build Products
      - name: Upload iPhone test products
        id: upload_ios_products
        if: ${{ !cancelled() && steps.package_ios_products.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: iphone-test-products-${{ github.run_attempt }}
          path: ${{ runner.temp }}/iphone-test-products.tar.gz
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
      - name: Test iPhone models
        if: ${{ !cancelled() && steps.build_ios_tests.outcome == 'success' }}
        run: >-
          xcodebuild -project ios/RoomInTheCart.xcodeproj -scheme RoomInTheCart
          -configuration Debug -destination "platform=iOS Simulator,id=$SIMULATOR_ID"
          -derivedDataPath .build/DerivedData -resultBundlePath .build/ModelTests.xcresult
          -parallel-testing-enabled NO -test-timeouts-enabled YES
          -default-test-execution-time-allowance 720 -maximum-test-execution-time-allowance 900
          -collect-test-diagnostics never -only-testing:RoomInTheCartTests
          CODE_SIGN_IDENTITY=- test-without-building
      - name: Upload iPhone model test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iphone-model-results-${{ github.run_attempt }}
          path: .build/ModelTests.xcresult
          retention-days: 7
          if-no-files-found: ignore
  ios-ui:
    needs: ios
    if: ${{ !cancelled() && needs.ios.outputs.test_products_artifact != '' }}
    runs-on: macos-15-intel
    timeout-minutes: 115
    strategy:
      fail-fast: false
      matrix:
        shard: [planning-pickup, comparison-context]
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      UI_SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v4
      - name: Download iPhone test products
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.ios.outputs.test_products_artifact }}
          path: ${{ runner.temp }}
          merge-multiple: true
      - name: Restore iPhone test products
        run: |
          mkdir -p .build/DerivedData/Build
          tar -xzf "$RUNNER_TEMP/iphone-test-products.tar.gz" -C .build/DerivedData/Build
      - name: Select available iPhone simulator
        run: xcrun simctl list devices available -j | python3 scripts/select_ci_iphone.py
      - name: Wait for iPhone simulator boot
        timeout-minutes: 12
        run: xcrun simctl bootstatus "$SIMULATOR_ID" -b
      - name: Test iPhone journeys
        shell: bash
        timeout-minutes: 92
        run: |
          set -o pipefail
          test_runs=(.build/DerivedData/Build/Products/RoomInTheCart_iphonesimulator*.xctestrun)
          test "${#test_runs[@]}" -eq 1
          test -f "${test_runs[0]}"
          planning_suites=(
            FreeJourneyUITests
            PickupOfferUITests
            LedgerConfirmedStockPackUITests
            ContextualReminderUITests
            NavigationRestorationUITests
          )
          selectors=()
          case "$UI_SHARD" in
            planning-pickup) mode=only ;;
            comparison-context)
              mode=skip
              selectors+=('-skip-testing:RoomInTheCartTests')
              ;;
            *) exit 1 ;;
          esac
          # The second shard also picks up future UI suites.
          for suite in "${planning_suites[@]}"; do
            selectors+=("-${mode}-testing:RoomInTheCartUITests/$suite")
          done
          run_journeys() {
            local result_bundle="$1" log="$2"
            xcodebuild -xctestrun "${test_runs[0]}" \
              -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
              -resultBundlePath "$result_bundle" \
              -parallel-testing-enabled NO -test-timeouts-enabled YES \
              -default-test-execution-time-allowance 720 -maximum-test-execution-time-allowance 900 \
              -collect-test-diagnostics never "${selectors[@]}" test-without-building \
              2>&1 | tee "$log"
          }
          if run_journeys .build/UITests.xcresult .build/UITests.log; then
            exit 0
          fi
          # A killed runner before connection never executed a journey.
          if ! grep -Fq 'Test crashed with signal kill before establishing connection.' .build/UITests.log ||
             grep -Eq '^Test Case .* started\.' .build/UITests.log; then
            exit 1
          fi
          echo 'Retrying once after the XCTest runner was killed before connection.'
          xcrun simctl shutdown "$SIMULATOR_ID" || true
          xcrun simctl bootstatus "$SIMULATOR_ID" -b
          run_journeys .build/UITests-retry.xcresult .build/UITests-retry.log
      - name: Upload iPhone journey test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iphone-ui-results-${{ matrix.shard }}-${{ github.run_attempt }}
          path: |
            .build/UITests.xcresult
            .build/UITests.log
            .build/UITests-retry.xcresult
            .build/UITests-retry.log
          retention-days: 7
          if-no-files-found: ignore
