        \ in the input inventory\")\n        receipt.update(createdUDID=created, creationStatus=\"created\")\n        save_receipt(path,\
        \ receipt)\n        device = current_owned_device(receipt)\n        if device is None or device.get(\"state\") !=\
        \ \"Shutdown\":\n            raise ValueError(\"Fresh device was not found in Shutdown state\")\n        receipt[\"\
        creationStatus\"] = \"verified\"\n        save_receipt(path, receipt)\n        publish(created, receipt[\"createdName\"\
        ])\n        return receipt\n    except (KeyError, ValueError, OSError, subprocess.SubprocessError) as error:\n   \
        \     receipt[\"creationStatus\"] = \"failed\"\n        receipt[\"creationError\"] = str(error)\n        if isinstance(error,\
        \ subprocess.CalledProcessError) and error.stderr:\n            receipt[\"creationStderr\"] = error.stderr[-16384:]\n\
        \        save_receipt(path, receipt)\n        raise\n\n\ndef cleanup(path):\n    if not path.exists() and not path.is_symlink():\n\
        \        print(\"No simulator ownership receipt; no device cleanup attempted.\")\n        return\n    if path.is_symlink()\
        \ or not path.is_file() or path.stat().st_size > 65536:\n        raise ValueError(\"Refusing an invalid simulator\
        \ ownership receipt\")\n    receipt = json.loads(path.read_text(encoding=\"utf-8\"))\n    # Verify ownership before\
        \ recording anything or issuing a simulator mutation.\n    if receipt.get(\"schema\") != 1 or receipt.get(\"owner\"\
        ) != owner_identity():\n        raise ValueError(\"Simulator receipt belongs to another CI owner or toolchain\")\n\
        \    if receipt.get(\"createdName\") != owned_name(receipt[\"owner\"], receipt[\"nonce\"]):\n        raise ValueError(\"\
        Simulator receipt has an invalid owned device name\")\n    created = receipt.get(\"createdUDID\")\n    if created\
        \ is None:\n        receipt[\"cleanup\"] = {\"status\": \"no-created-device\", \"note\": \"No verified creation UUID;\
        \ no device mutation attempted.\"}\n        save_receipt(path, receipt)\n        return\n    if str(UUID(created)).upper()\
        \ != created or created == str(UUID(receipt[\"sourceUDID\"])).upper():\n        raise ValueError(\"Refusing to clean\
        \ up the source image device or invalid UUID\")\n    if os.environ.get(\"SIMULATOR_ID\", created) != created:\n  \
        \      raise ValueError(\"Current simulator environment does not match the owned UUID\")\n    receipt[\"cleanup\"\
        ] = {\"status\": \"checking\"}\n    save_receipt(path, receipt)\n    try:\n        device = current_owned_device(receipt)\n\
        \        if device is not None:\n            if device.get(\"state\") == \"Booted\":\n                receipt[\"cleanup\"\
        ][\"status\"] = \"shutting-down\"\n                save_receipt(path, receipt)\n                simctl(\"shutdown\"\
        , created)\n                device = current_owned_device(receipt)\n            if device is None or device.get(\"\
        state\") != \"Shutdown\":\n                raise ValueError(\"Owned device is not safely shut down; refusing deletion\"\
        )\n            receipt[\"cleanup\"][\"status\"] = \"deleting\"\n            save_receipt(path, receipt)\n        \
        \    simctl(\"delete\", created)\n            if current_owned_device(receipt) is not None:\n                raise\
        \ ValueError(\"Owned device remains after deletion\")\n            receipt[\"cleanup\"] = {\"status\": \"deleted\"\
        }\n        else:\n            receipt[\"cleanup\"] = {\"status\": \"already-absent\"}\n        save_receipt(path,\
        \ receipt)\n        print(\"Owned CI simulator cleanup: \" + receipt[\"cleanup\"][\"status\"])\n    except (KeyError,\
        \ ValueError, OSError, subprocess.SubprocessError) as error:\n        receipt[\"cleanup\"] = {\"status\": \"failed\"\
        , \"error\": str(error)}\n        save_receipt(path, receipt)\n        raise\n\n\ndef publish(udid, name):\n    print(f\"\
        Using {name} simulator ({udid})\")\n    with open(os.environ[\"GITHUB_ENV\"], \"a\") as output:\n        output.write(f\"\
        SIMULATOR_ID={udid}\\n\")\n\n\ndef main():\n    parser = argparse.ArgumentParser(description=__doc__)\n    mode =\
        \ parser.add_mutually_exclusive_group()\n    mode.add_argument(\"--create-owned\", type=Path, metavar=\"RECEIPT\"\
