name: Build and test
run-name: SwiftUI Menu diagnostic only

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      require_release_metadata:
        description: Reserved for the release workflow; this diagnostic branch rejects it
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  swiftui-menu-diagnostic:
    name: SwiftUI Menu runtime warning diagnostic
    runs-on: macos-15
    timeout-minutes: 18
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      EVIDENCE: .build/menu-runtime-diagnostic
    steps:
      - name: Reject release use of this diagnostic branch
        if: ${{ inputs.require_release_metadata }}
        run: |
          echo '::error::This isolated diagnostic cannot satisfy the pre-release checks.'
          exit 1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Require the original hosted toolchain and simulator profile
        shell: bash
        run: |
          mkdir -p "$EVIDENCE"
          xcodebuild -version | tee "$EVIDENCE/toolchain.txt"
          test "$(cat "$EVIDENCE/toolchain.txt")" = $'Xcode 26.3\nBuild version 17C529'
          test "$(uname -m)" = arm64
          sw_vers > "$EVIDENCE/host.txt"
          xcrun simctl list -j > "$EVIDENCE/simulator-inventory.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path

          data = json.loads((Path(os.environ['EVIDENCE']) / 'simulator-inventory.json').read_text())
          runtime_id = 'com.apple.CoreSimulator.SimRuntime.iOS-26-2'
          runtime, = [item for item in data['runtimes'] if item['identifier'] == runtime_id and item['isAvailable']]
          if runtime['buildversion'] != '23C54':
              raise SystemExit('Expected hosted iOS 26.2 runtime build 23C54')
          device, = [item for item in data['devices'][runtime_id] if item['name'] == 'iPhone 17' and item['isAvailable']]
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              print(f"SIMULATOR_ID={device['udid']}", file=output)
          PY
      - name: Boot the pinned iPhone simulator
        timeout-minutes: 5
        run: xcrun simctl bootstatus "$SIMULATOR_ID" -b
      - name: Run the isolated Menu and no-menu scenarios once
        timeout-minutes: 8
        shell: bash
        run: |
          xcodebuild -project diagnostics/swiftui-menu/MenuRuntimeDiagnostic.xcodeproj \
            -scheme MenuRuntimeDiagnostic -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" -parallel-testing-enabled NO -jobs 2 \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 60 \
            -maximum-test-execution-time-allowance 90 -collect-test-diagnostics never \
            -derivedDataPath "$RUNNER_TEMP/menu-runtime-derived" \
            -resultBundlePath "$EVIDENCE/MenuDiagnostic.xcresult" CODE_SIGN_IDENTITY=- test \
            2>&1 | tee "$EVIDENCE/XCTest.log"
      - name: Retain and correlate exact XCTest runtime warnings
        if: ${{ always() && !inputs.require_release_metadata }}
        shell: bash
        run: |
          bundle="$EVIDENCE/MenuDiagnostic.xcresult"
          test -d "$bundle"
          xcrun xcresulttool get test-results summary --path "$bundle" --compact > "$EVIDENCE/test-summary.json"
          xcrun xcresulttool get test-results tests --path "$bundle" --compact > "$EVIDENCE/test-tree.json"
          python3 diagnostics/swiftui-menu/report.py "$EVIDENCE" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Upload the diagnostic bundle and exact warning evidence
        if: ${{ always() && !inputs.require_release_metadata }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: swiftui-menu-runtime-diagnostic
          path: .build/menu-runtime-diagnostic/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
