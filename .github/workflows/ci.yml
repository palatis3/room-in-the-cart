name: Bitrise M2 environment probe
run-name: Bitrise recovery · one M2 environment probe
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ritc-bitrise-m2-environment-probe
  cancel-in-progress: false
jobs:
  recovery:
    runs-on: 'bitrise-runner-room in cart'
    timeout-minutes: 10
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout: scripts
      - name: Verify the M2 environment without cache activation
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = self-hosted
          test "$(uname -m)" = arm64
          test "$(uname -s)" = Darwin
          bitrise_xcode=/Applications/Xcode-27.1.0.app/Contents/Developer
          test -d "$bitrise_xcode"
          test "$(DEVELOPER_DIR="$bitrise_xcode" xcodebuild -version)" = $'Xcode 27.1\nBuild version 27A9275'
          if [ ! -e /Applications/Xcode_27.1.app ]; then
            sudo ln -s /Applications/Xcode-27.1.0.app /Applications/Xcode_27.1.app
          fi
          bash scripts/check_ci_xcode27.sh
          mkdir -p .build/bitrise-environment
          xcrun simctl list runtimes -j > .build/bitrise-environment/runtimes.json
          xcrun simctl runtime list -j > .build/bitrise-environment/runtime-images.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: bitrise-m2-environment-${{ github.run_attempt }}
          include-hidden-files: true
          retention-days: 7
          path: .build/bitrise-environment
