name: Build and test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      require_release_metadata:
        description: Reject missing production support, policy and Apple product metadata
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: core-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  typescript:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        package: [web, service]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: ${{ matrix.package }}/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: ${{ matrix.package }}
      - run: npm test
        working-directory: ${{ matrix.package }}
      - name: Check contributor outbox and history privacy in Chrome
        if: matrix.package == 'web'
        timeout-minutes: 2
        env:
          DEBUG: pw:browser
        run: npm run test:browser
        working-directory: web
  service-postgres:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: fixture-only
          POSTGRES_DB: ritc_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ritc_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_ADMIN_DATABASE_URL: postgresql://postgres:fixture-only@127.0.0.1:5432/ritc_test
      MIGRATION_DATABASE_URL: postgresql://postgres:fixture-only@127.0.0.1:5432/ritc_test
      TEST_DATABASE_URL: postgresql://ritc_runtime:fixture-only@127.0.0.1:5432/ritc_test
      TEST_WORKER_DATABASE_URL: postgresql://ritc_test_worker:fixture-only@127.0.0.1:5432/ritc_test
      BILLING_TEST_ADMIN_DATABASE_URL: postgresql://postgres:fixture-only@127.0.0.1:5432/ritc_test
      BILLING_TEST_DATABASE_URL: postgresql://ritc_runtime:fixture-only@127.0.0.1:5432/ritc_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: service/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: service
      - name: Build the web client for the PostgreSQL browser retry tests
        run: npm ci --ignore-scripts && npm run build
        working-directory: web
      - name: Prepare disposable provider-session and maintenance fixtures
        run: |
          psql "$TEST_ADMIN_DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          CREATE SCHEMA auth;
          CREATE TABLE auth.users(id uuid PRIMARY KEY, email text, email_confirmed_at timestamptz);
          CREATE TABLE auth.sessions(id uuid PRIMARY KEY, user_id uuid NOT NULL, not_after timestamptz);
          SQL
          psql "$TEST_ADMIN_DATABASE_URL" -v ON_ERROR_STOP=1 -c 'CREATE DATABASE ritc_operations'
      - run: npm run migrate
        working-directory: service
      - name: Create restricted app, guardian verification and worker roles
        run: |
          psql "$TEST_ADMIN_DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE ritc_runtime LOGIN PASSWORD 'fixture-only' NOSUPERUSER NOBYPASSRLS;
          GRANT ritc_app TO ritc_runtime;
          CREATE ROLE ritc_guardian_test_verifier LOGIN PASSWORD 'fixture-only' NOSUPERUSER NOBYPASSRLS;
          GRANT ritc_guardian_verifier TO ritc_guardian_test_verifier;
          CREATE ROLE ritc_test_worker LOGIN PASSWORD 'fixture-only' NOSUPERUSER NOBYPASSRLS;
          GRANT ritc_worker TO ritc_test_worker;
          -- Negative readiness fixture. A verifier must reject this combined identity.
          CREATE ROLE ritc_guardian_combined_worker LOGIN PASSWORD 'fixture-only' NOSUPERUSER NOBYPASSRLS;
          GRANT ritc_guardian_verifier, ritc_worker TO ritc_guardian_combined_worker;
          SQL
      - run: npm test && npm run test:integration
        working-directory: service
        env:
          RITC_TEST_WEB_WIRE: "1"
      - name: Verify maintenance with a separate database and worker role
        run: node scripts/test-operations.mjs
        working-directory: service
        env:
          OPERATIONS_TEST_DATABASE_URL: postgresql://ritc_runtime:fixture-only@127.0.0.1:5432/ritc_operations
          OPERATIONS_TEST_ADMIN_DATABASE_URL: postgresql://postgres:fixture-only@127.0.0.1:5432/ritc_operations
          TEST_WORKER_DATABASE_URL: postgresql://ritc_test_worker:fixture-only@127.0.0.1:5432/ritc_operations
  source-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Validate workflow syntax and expression references
        shell: bash
        run: |
          yaml_env="$RUNNER_TEMP/ci-yaml"
          python3 -m venv "$yaml_env"
          "$yaml_env/bin/python" -m pip install --disable-pip-version-check --no-cache-dir \
            --no-deps --require-hashes --only-binary=:all: -r scripts/ci_yaml_requirements.txt
          echo "$yaml_env/bin" >> "$GITHUB_PATH"
          lint_dir="$RUNNER_TEMP/actionlint"
          mkdir -p "$lint_dir"
          curl --fail --silent --show-error --location \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$lint_dir/actionlint.tar.gz"
          echo '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tar.gz' \
            | (cd "$lint_dir" && sha256sum --check)
          tar -xzf "$lint_dir/actionlint.tar.gz" -C "$lint_dir" actionlint
          "$yaml_env/bin/python" scripts/check_ci_workflows.py --actionlint "$lint_dir/actionlint" \
            --report .build/workflow-lint.json
      - name: Verify the pinned Node release is supported and security-current
        timeout-minutes: 1
        run: python3 scripts/check_node_runtime.py
      - name: Validate generated files, localization and CI test selection
        run: |
          python3 scripts/generate_theme.py --check
          python3 scripts/check_localization.py
          python3 scripts/generate_xcode_project.py --check
          python3 -m unittest discover -s scripts -p 'test_*.py'
          bash -n scripts/run_ios_test_shard.sh
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        id: foundation-python
        with:
          python-version: '3.13'
          update-environment: false
      - name: Verify the Foundation 2.1 product contracts and reference scenarios
        working-directory: docs/product/foundation-gen2.1
        env:
          FOUNDATION_PYTHON: ${{ steps.foundation-python.outputs.python-path }}
        run: '"$FOUNDATION_PYTHON" -B verify.py'
  swift-packages:
    concurrency:
      group: ritc-macos-slot-0
      queue: max
      cancel-in-progress: false
    runs-on: macos-15
    timeout-minutes: 25
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Test Swift packages and collect coverage
        run: |
          set -o pipefail
          mkdir -p .build/package-results
          for manifest in ios/Packages/*/Package.swift; do
            package="$(dirname "$manifest")"
            name="$(basename "$package")"
            swift test --package-path "$package" --enable-code-coverage 2>&1 | tee ".build/package-results/$name.log"
            swift test --package-path "$package" list --skip-build > ".build/package-results/$name.inventory.txt"
          done
          python3 scripts/check_swift_package_results.py --results .build/package-results
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: swift-package-results-${{ github.run_attempt }}
          include-hidden-files: true
          path: |
            .build/package-results
            ios/Packages/**/.build/**/codecov/*.json
          retention-days: 7
  ios-release:
    concurrency:
      group: ritc-macos-slot-1
      queue: max
      cancel-in-progress: false
    runs-on: macos-15
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      REQUIRE_RELEASE_METADATA: ${{ inputs.require_release_metadata }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Compile unsigned Release for iPhone
        timeout-minutes: 30
        shell: bash
        run: |
          mkdir -p .build
          xcodebuild -project ios/RoomInTheCart.xcodeproj -scheme RoomInTheCart-Release \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -jobs 2 -derivedDataPath .build/ReleaseDerivedData ARCHS=arm64 \
            CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO build 2>&1 | tee .build/ReleaseBuild.log
      - name: Verify the compiled iPhone app and embedded extensions
        shell: bash
        run: |
          args=(--configuration Release)
          if [[ "$REQUIRE_RELEASE_METADATA" == true ]]; then
            args+=(--require-release-metadata)
          fi
          python3 scripts/check_built_app.py .build/ReleaseDerivedData/Build/Products/Release-iphoneos/RoomInTheCart.app "${args[@]}"
      - name: Retain Release compilation log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: iphone-release-build-log-${{ github.run_attempt }}
          path: .build/ReleaseBuild.log
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: ignore
  ios-swift-codeql:
    concurrency:
      group: ritc-macos-slot-4
      queue: max
      cancel-in-progress: false
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
      actions: read
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Record Swift analysis toolchain
        shell: bash
        run: |
          mkdir -p .build
          {
            uname -m
            xcodebuild -version
            swift --version
          } | tee .build/SwiftCodeQLToolchain.log
      - name: Validate Release Swift settings before tracing
        shell: bash
        run: |
          # GitHub's Swift extraction guidance requires uncached compilation and the legacy driver.
          # https://docs.github.com/en/code-security/tutorials/customize-code-scanning/prepare-code-for-analysis
          build_args=(
            -project ios/RoomInTheCart.xcodeproj -scheme RoomInTheCart-Release
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS'
            -jobs 2 -derivedDataPath .build/SwiftCodeQLDerivedData ARCHS=arm64
            CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
            COMPILATION_CACHE_ENABLE_CACHING=NO SWIFT_ENABLE_COMPILE_CACHE=NO
            SWIFT_USE_INTEGRATED_DRIVER=NO SWIFT_OPTIMIZATION_LEVEL=-Onone
            SWIFT_COMPILATION_MODE=wholemodule
          )
          cat > .build/SwiftCodeQLAssertUncompiled.py <<'PY'
          from pathlib import Path
          import json
          import re
          import stat

          # Settings resolution may write PIF JSON, but must not compile runtime sources.
          # Fail closed on other DerivedData/Build files, even if their suffix is unknown.
          derived_build = Path(".build/SwiftCodeQLDerivedData/Build")
          roots = [derived_build, *Path("ios/Packages").glob("*/.build")]
          product_suffixes = {
              ".o", ".obj", ".a", ".dylib", ".so", ".dll", ".swiftmodule", ".swiftdoc",
              ".swiftinterface", ".swiftsourceinfo", ".pcm", ".bc", ".air", ".metallib", ".ipa",
          }
          product_directories = {".app", ".appex", ".framework", ".xcframework", ".xcarchive", ".dSYM", ".bundle", ".swiftmodule"}
          binary_magic = (
              b"\xfe\xed\xfa\xce", b"\xce\xfa\xed\xfe", b"\xfe\xed\xfa\xcf", b"\xcf\xfa\xed\xfe",
              b"\xca\xfe\xba\xbe", b"\xbe\xba\xfe\xca", b"\xca\xfe\xba\xbf", b"\xbf\xba\xfe\xca",
              b"\x7fELF", b"MZ", b"!<arch>\n", b"BC\xc0\xde", b"\xde\xc0\x17\x0b",
          )
          pif_names = {"project": "(?:PROJECT|PACKAGE)", "target": "TARGET", "workspace": "WORKSPACE"}


          def planning_metadata(path):
              parts = path.relative_to(derived_build).parts
              if len(parts) != 5 or parts[:3] != ("Intermediates.noindex", "XCBuildData", "PIFCache"):
                  return False
              prefix = pif_names.get(parts[3])
              if prefix is None or re.fullmatch(prefix + r"@v[0-9]+_.+-json", parts[4]) is None:
                  return False
              try:
                  return isinstance(json.loads(path.read_text(encoding="utf-8")), dict)
              except (OSError, UnicodeError, json.JSONDecodeError):
                  return False


          found = []
          for root in roots:
              if root.is_symlink():
                  found.append(str(root) + " [symlink]")
                  continue
              if not root.exists():
                  continue
              for path in root.rglob("*"):
                  mode = path.lstat().st_mode
                  reason = None
                  if stat.S_ISLNK(mode):
                      reason = "symlink"
                  elif stat.S_ISDIR(mode):
                      if path.suffix in product_directories:
                          reason = "product bundle"
                  elif not stat.S_ISREG(mode):
                      reason = "non-regular output"
                  elif path.suffix in product_suffixes:
                      reason = "compiled product suffix"
                  elif mode & 0o111:
                      reason = "executable output"
                  else:
                      with path.open("rb") as stream:
                          header = stream.read(8)
                      if header.startswith(binary_magic):
                          reason = "compiled binary header"
                      elif root == derived_build and not planning_metadata(path):
                          reason = "unrecognized Build output"
                  if reason:
                      found.append(str(path) + " [" + reason + "]")
          if found:
              raise SystemExit("Swift CodeQL requires uncompiled app/package sources; found: " + ", ".join(sorted(found)[:20]))
          print("No pre-existing app/package compiled products; permitted only recognized PIF JSON in DerivedData/Build.")
          PY
          python3 .build/SwiftCodeQLAssertUncompiled.py
          settings="$RUNNER_TEMP/swift-codeql-settings.json"
          xcodebuild "${build_args[@]}" -showBuildSettings -json > "$settings" 2> .build/SwiftCodeQLSettings.stderr.log
          python3 - "$settings" <<'PY' | tee .build/SwiftCodeQLSettings.log
          import json, sys
          from pathlib import Path

          targets = json.loads(Path(sys.argv[1]).read_text())
          app = [target["buildSettings"] for target in targets if target.get("target") == "RoomInTheCart"]
          if len(app) != 1:
              raise SystemExit("Expected exactly one RoomInTheCart app target in Xcode build settings.")
          expected = {"CONFIGURATION": "Release", "PLATFORM_NAME": "iphoneos", "ARCHS": "arm64", "SWIFT_OPTIMIZATION_LEVEL": "-Onone", "SWIFT_COMPILATION_MODE": "wholemodule"}
          actual = {key: app[0].get(key) for key in expected}
          conditions = app[0].get("SWIFT_ACTIVE_COMPILATION_CONDITIONS", "").split()
          print(json.dumps({**actual, "SWIFT_ACTIVE_COMPILATION_CONDITIONS": conditions}, indent=2))
          if actual != expected or "RELEASE" not in conditions or "DEBUG" in conditions:
              raise SystemExit("Swift CodeQL must compile all Release sources in whole-module mode for arm64 iPhoneOS with optimization disabled.")
          PY
          python3 .build/SwiftCodeQLAssertUncompiled.py
          declare -p build_args > .build/SwiftCodeQLBuildArgs.sh
      - name: Initialize Swift security analysis
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: swift
          build-mode: manual
          debug: true
      - name: Compile Release Swift sources for CodeQL
        timeout-minutes: 45
        shell: bash
        run: |
          source .build/SwiftCodeQLBuildArgs.sh
          python3 .build/SwiftCodeQLAssertUncompiled.py
          xcodebuild "${build_args[@]}" build 2>&1 | tee .build/SwiftCodeQLBuild.log
      - name: Analyze Swift security findings
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:swift
      - name: Retain Swift analysis compilation logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: iphone-swift-codeql-build-logs-${{ github.run_attempt }}
          path: |
            .build/SwiftCodeQLToolchain.log
            .build/SwiftCodeQLSettings.log
            .build/SwiftCodeQLSettings.stderr.log
            .build/SwiftCodeQLBuild.log
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: ignore
  ios-build:
    concurrency:
      group: ritc-macos-slot-3
      queue: max
      cancel-in-progress: false
    runs-on: macos-15
    timeout-minutes: 35
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    outputs:
      test_products_artifact: ${{ steps.upload.outputs['artifact-id'] }}
      test_matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Check supported keyboard automation before simulator setup
        run: python3 scripts/test_ui_automation_contract.py
      - name: Record toolchain and select iPhone
        run: |
          xcodebuild -version
          swift --version
          xcrun simctl list devices available -j | python3 scripts/select_ci_iphone.py
      - name: Build iPhone simulator test products once
        run: >-
          xcodebuild -project ios/RoomInTheCart.xcodeproj -scheme RoomInTheCart
          -configuration Debug -destination "platform=iOS Simulator,id=$SIMULATOR_ID"
          -jobs 2 -derivedDataPath .build/DerivedData CODE_SIGN_IDENTITY=- build-for-testing
      - name: Verify the compiled simulator app
        run: python3 scripts/check_built_app.py .build/DerivedData/Build/Products/Debug-iphonesimulator/RoomInTheCart.app --configuration Debug
      - name: Discover compiled tests and balance UI groups
        id: plan
        shell: bash
        run: |
          python3 scripts/discover_ios_tests.py --simulator "$SIMULATOR_ID"
          python3 -c 'import json; from pathlib import Path; p=json.loads(Path(".build/test-plan/manifest.json").read_text()); print("matrix=" + json.dumps({"include":p["include"]}))' >> "$GITHUB_OUTPUT"
      - name: Retain test discovery attempts
        if: always() && steps.plan.outcome != 'skipped'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: iphone-test-discovery-${{ github.run_attempt }}
          path: |
            .build/test-discovery/stages.txt
            .build/test-discovery/attempt-1.json
            .build/test-discovery/attempt-2.json
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error
      - name: Package test products and exact selection
        run: |
          tar -czf "$RUNNER_TEMP/iphone-test-products.tar.gz" -C .build/DerivedData/Build Products -C "$GITHUB_WORKSPACE/.build" test-plan
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        id: upload
        with:
          name: iphone-test-products-${{ github.run_attempt }}
          path: ${{ runner.temp }}/iphone-test-products.tar.gz
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
  ios-tests:
    name: ios-tests (${{ matrix.shard }}, ${{ matrix.expected_count }})
    concurrency:
      group: ritc-macos-slot-${{ matrix.macos_slot }}
      queue: max
      cancel-in-progress: false
    needs: ios-build
    runs-on: macos-15
    timeout-minutes: 55
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix: ${{ fromJSON(needs.ios-build.outputs.test_matrix) }}
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      TEST_SHARD: ${{ matrix.shard }}
      EXPECTED_TEST_COUNT: ${{ matrix.expected_count }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.ios-build.outputs.test_products_artifact }}
          path: .build/download
          merge-multiple: true
      - name: Restore iPhone test products and selection
        run: |
          mkdir -p .build/DerivedData/Build
          tar -xzf .build/download/iphone-test-products.tar.gz -C .build/DerivedData/Build
          mv .build/DerivedData/Build/test-plan .build/test-plan
      - name: Select and boot iPhone simulator
        timeout-minutes: 8
        run: |
          xcrun simctl list devices available -j | python3 scripts/select_ci_iphone.py
      - name: Wait for simulator boot
        timeout-minutes: 8
        run: python3 scripts/boot_ios_simulator.py "$SIMULATOR_ID"
      - name: Run selected tests and verify complete execution
        timeout-minutes: 40
        run: bash scripts/run_ios_test_shard.sh
      - name: Retain result bundles, screenshots, logs and timing
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: iphone-results-${{ matrix.shard }}-${{ github.run_attempt }}
          include-hidden-files: true
          path: |
            .build/Tests*.xcresult
            .build/Tests*.log
            .build/test-*.json
            .build/test-plan/
          retention-days: 7
          if-no-files-found: ignore
  ci-gate:
    name: CI gate
    needs: [typescript, service-postgres, source-checks, swift-packages, ios-release, ios-swift-codeql, ios-build, ios-tests]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      JOB_RESULTS: ${{ toJSON(needs) }}
    steps:
      - name: Require every build and test job to succeed
        run: |
          python3 - <<'PY'
          import json, os
          jobs = json.loads(os.environ["JOB_RESULTS"])
          failures = {name: job["result"] for name, job in jobs.items() if job["result"] != "success"}
          if failures:
              raise SystemExit(f"Required jobs did not pass: {failures}")
          print("Every required build and test job passed.")
          PY
