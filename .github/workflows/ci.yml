        \ time.monotonic() + 60\n    while set(old).intersection(pids()):\n        assert time.monotonic() < deadline, 'Original\
        \ service did not exit; no escalation permitted'\n        time.sleep(1)\n    receipt['oldExited'] = True; save()\n\
        \    inventory('service-after.json')\n    new = pids(); assert len(new) == 1 and not set(old).intersection(new), new\n\
        \    receipt.update(newPids=new, afterVerified=True, outcome='success'); save()\nexcept BaseException as error:\n\
        \    receipt.update(outcome='failure', error=str(error)); save(); raise\nRITC_REFRESH\nprintf '%s  %s\\n' '69d2dcf80b0276c2578a70556eabe78fe061fd5d3e769c90fb64b801ff9139f1'\
        \ '.build/refresh_simulator_service.py' | shasum -a 256 -c -\npython3 .build/refresh_simulator_service.py\n"
    - name: Verify a746 products and select original failed produce journey
      run: "set -euo pipefail\ntest \"$(git rev-parse HEAD)\" = a746ff60d13cfae205a743a481ed9248ef559d54\ntest \"$(git rev-parse\
