        \ '.build/test-plan/ui-09.txt' | shasum -a 256 -c -\ngrep -Fx 'RoomInTheCartUITests/ContextualNavigationUITests/testUnknownProduceWeightUsesSavedWholePickupCapAndBillingIncrement'\
        \ .build/test-plan/ui-03.txt > .build/test-plan/produce-focus.txt\ntest \"$(wc -l < .build/test-plan/produce-focus.txt\
        \ | tr -d ' ')\" = 1\ncat > .build/select_ci_iphone.py <<'RITC_OWNERSHIP_HELPER'\n#!/usr/bin/env python3\n\"\"\"Select\
        \ an image iPhone, or opt in to a job-owned device with identical type/runtime.\"\"\"\nimport argparse\nimport json\n\
        import os\nfrom pathlib import Path\nimport re\nimport subprocess\nimport sys\nfrom uuid import UUID, uuid4\n\n\n\
        def select_iphone(devices_by_runtime, required_runtime=None, required_name=None):\n    if bool(required_runtime) !=\
        \ bool(required_name):\n        raise ValueError('Pin both CI_IPHONE_RUNTIME and CI_IPHONE_NAME, or neither')\n  \
        \  candidates = []\n    for runtime, devices in devices_by_runtime.items():\n        if \".iOS-\" not in runtime:\n\
        \            continue\n        if required_runtime and runtime != required_runtime:\n            continue\n      \
        \  version = tuple(map(int, runtime.split(\".iOS-\", 1)[1].split(\"-\")))\n        for device in devices:\n      \
        \      if required_name and device['name'] != required_name:\n                continue\n            if device[\"name\"\
        ].startswith(\"iPhone\") and device.get(\"isAvailable\"):\n                candidates.append((version, runtime, device))\n\
        \    if not candidates:\n        raise ValueError(\"No available iPhone simulator matching the requested runtime/device\"\
        )\n    _, runtime, device = max(candidates, key=lambda item: (item[0], item[2][\"name\"] == \"iPhone 17\"))\n    return\
        \ runtime, device\n\n\ndef simctl(*args):\n    # The workflow setup/cleanup deadlines own this bound. On a slow hosted\n\
        \    # image, even listing devices has taken over three minutes; do not impose\n    # a second, shorter per-command\
        \ timeout or retry the operation.\n    return subprocess.run([\"xcrun\", \"simctl\", *args], check=True, capture_output=True,\n\
        \                          text=True).stdout\n\n\ndef owner_identity():\n    owner = {key: os.environ[key] for key\
        \ in\n             (\"GITHUB_REPOSITORY\", \"GITHUB_RUN_ID\", \"GITHUB_RUN_ATTEMPT\", \"GITHUB_JOB\", \"TEST_SHARD\"\
        , \"DEVELOPER_DIR\")}\n    if (not re.fullmatch(r\"[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+\", owner[\"GITHUB_REPOSITORY\"\
        ])\n            or any(not re.fullmatch(r\"[0-9]+\", owner[key]) for key in (\"GITHUB_RUN_ID\", \"GITHUB_RUN_ATTEMPT\"\
        ))\n            or any(not re.fullmatch(r\"[A-Za-z0-9_-]+\", owner[key]) for key in (\"GITHUB_JOB\", \"TEST_SHARD\"\
        ))\n            or not Path(owner[\"DEVELOPER_DIR\"]).is_absolute() or \"\\n\" in owner[\"DEVELOPER_DIR\"]):\n   \
        \     raise ValueError(\"Invalid CI owner identity\")\n    return owner\n\n\ndef runtime_identity(identifier):\n \
        \   matches = [r for r in json.loads(simctl(\"list\", \"runtimes\", \"-j\"))[\"runtimes\"]\n               if r.get(\"\
        identifier\") == identifier]\n    # Do not let an identical runtime identifier conceal different installed builds.\n\
        \    if len(matches) != 1 or matches[0].get(\"isAvailable\") is not True:\n        raise ValueError(\"Chosen runtime\
        \ is unavailable or ambiguously resolves to installed builds\")\n    row = matches[0]\n    keys = (\"identifier\"\
        , \"version\", \"buildversion\", \"bundlePath\")\n    if any(not isinstance(row.get(key), str) or not row[key].strip()\
        \ for key in keys):\n        raise ValueError(\"Chosen runtime lacks exact version/build/bundle identity\")\n    return\
        \ {key: row[key] for key in keys}\n\n\ndef owned_name(owner, nonce):\n    UUID(nonce)\n    return f\"RITC-CI-{owner['GITHUB_RUN_ID']}-{owner['GITHUB_RUN_ATTEMPT']}-{owner['GITHUB_JOB']}-{owner['TEST_SHARD']}-{nonce}\"\
        \n\n\ndef save_receipt(path, receipt):\n    # Replace our receipt atomically; never follow a receipt symlink on writes.\n\
        \    temporary = path.with_name(path.name + \".tmp\")\n    with temporary.open(\"x\", encoding=\"utf-8\") as output:\n\
        \        json.dump(receipt, output, indent=2)\n        output.write(\"\\n\")\n    temporary.replace(path)\n\n\ndef\
        \ current_owned_device(receipt):\n    if runtime_identity(receipt[\"runtime\"][\"identifier\"]) != receipt[\"runtime\"\
        ]:\n        raise ValueError(\"Chosen runtime identity changed\")\n    matches = [(runtime, device) for runtime, devices\
        \ in json.loads(simctl(\"list\", \"devices\", \"-j\"))[\"devices\"].items()\n               for device in devices\
        \ if device.get(\"udid\") == receipt[\"createdUDID\"]]\n    if not matches:\n        return None\n    if len(matches)\
        \ != 1:\n        raise ValueError(\"Created device UUID is ambiguous\")\n    runtime, device = matches[0]\n    if\
        \ (runtime != receipt[\"runtime\"][\"identifier\"] or device.get(\"name\") != receipt[\"createdName\"]\n         \
        \   or device.get(\"deviceTypeIdentifier\") != receipt[\"deviceTypeIdentifier\"]\n            or device.get(\"isAvailable\"\
        ) is not True):\n        raise ValueError(\"Current device does not match the owned name/type/runtime\")\n    return\
        \ device\n\n\ndef provision(devices, path):\n    if path.exists() or path.is_symlink():\n        raise ValueError(\"\
        Refusing to replace an existing simulator ownership receipt\")\n    runtime, source = select_iphone(devices, os.environ.get('CI_IPHONE_RUNTIME'),\
        \ os.environ.get('CI_IPHONE_NAME'))\n    owner = owner_identity()\n    source_id = str(UUID(source[\"udid\"])).upper()\n\
        \    device_type = source.get(\"deviceTypeIdentifier\")\n    if not isinstance(device_type, str) or not re.fullmatch(r\"\
        com\\.apple\\.CoreSimulator\\.SimDeviceType\\.[A-Za-z0-9-]+\", device_type):\n        raise ValueError(\"Selected\
        \ image device lacks an exact device type identifier\")\n    nonce = str(uuid4())\n    receipt = {\"schema\": 1, \"\
        owner\": owner, \"sourceUDID\": source_id, \"sourceName\": source[\"name\"],\n               \"deviceTypeIdentifier\"\
        : device_type, \"runtime\": runtime_identity(runtime), \"nonce\": nonce,\n               \"createdName\": owned_name(owner,\
        \ nonce), \"createdUDID\": None,\n               \"creationStatus\": \"pending\", \"cleanup\": {\"status\": \"not-run\"\
        }}\n    path.parent.mkdir(parents=True, exist_ok=True)\n    save_receipt(path, receipt)\n    try:\n        bundle\
        \ = Path(receipt[\"runtime\"][\"bundlePath\"])\n        root = bundle / \"Contents/Resources/RuntimeRoot\"\n     \
        \   receipt[\"runtimeFilesystem\"] = {\"bundle\": str(bundle), \"bundleExists\": bundle.is_dir(),\n              \
        \                          \"runtimeRoot\": str(root), \"runtimeRootExists\": root.is_dir(),\n                   \
        \                     \"rootSymlink\": root.is_symlink()}\n        receipt[\"creationRuntimeArgument\"] = str(bundle)\n\
        \        save_receipt(path, receipt)\n        if not (bundle.is_dir() and root.is_dir()):\n            raise ValueError(\"\
        Exact imported runtime bundle/root unavailable\")\n        created = str(UUID(simctl(\"create\", receipt[\"createdName\"\
        ], device_type, str(bundle)).strip())).upper()\n        if any(device.get(\"udid\", \"\").upper() == created for rows\
