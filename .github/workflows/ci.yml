        \  try:\n        if args.cleanup_owned:\n            cleanup(args.cleanup_owned)\n        else:\n            devices\
        \ = json.load(sys.stdin)[\"devices\"]\n            if args.create_owned:\n                provision(devices, args.create_owned)\n\
        \            else:\n                _, device = select_iphone(devices, os.environ.get('CI_IPHONE_RUNTIME'), os.environ.get('CI_IPHONE_NAME'))\n\
        \                publish(device[\"udid\"], device[\"name\"])\n    except (KeyError, ValueError, OSError, subprocess.SubprocessError)\
        \ as error:\n        parser.exit(1, f\"Simulator selection/ownership failed: {error}\\n\")\n\n\nif __name__ == \"\
        __main__\":\n    main()\nRITC_OWNERSHIP_HELPER\nprintf '%s  %s\\n' 'e6123dd7149ad9aadf60603f77d7817b563c5bcffae9fb77b89875b6876a1737'\
        \ '.build/select_ci_iphone.py' | shasum -a 256 -c -\nxcrun simctl list -j > .build/test-before-create.json\nxcrun\
        \ simctl list devices available -j | python3 .build/select_ci_iphone.py --create-owned .build/test-simulator-ownership.json\n"
    - name: Boot the owned iPhone
      timeout-minutes: 8
      run: python3 scripts/boot_ios_simulator.py "$SIMULATOR_ID"
    - name: Run original produce journey with unchanged native checks
      timeout-minutes: 40
      run: bash scripts/run_ios_test_shard.sh
