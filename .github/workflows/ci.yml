name: StoreKit runtime import canary
run-name: Runtime import experiment · original Spanish StoreKit
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: ritc-storekit-import-canary
  cancel-in-progress: false
jobs:
  runtime:
    runs-on: xcode-27
    concurrency:
      group: ritc-macos-slot-4
      cancel-in-progress: false
    timeout-minutes: 65
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
      CI_IPHONE_NAME: iPhone 17
      STOREKIT_LOCALE: es
      STOREKIT_CONFIGURATION: US Spanish app · Spanish (Mexico) offer · USA storefront
      REQUIRE_CURRENT_STOREKIT: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: f4c52431b44c4491325010c1f06e73f93e43b68e
          persist-credentials: false
      - name: Require the reviewed Xcode 27.1 toolchain
        run: bash scripts/check_ci_xcode27.sh
      - name: Verify exact original source and verifier pins
        shell: python
        run: |
          import hashlib, json, subprocess
          from pathlib import Path
          expected = {'scripts/check_ci_xcode27.sh': '9d981d4fa3202ec9700db3b191d0f30e1c330bbee878bc29c3a5df7ee966bd28', 'scripts/check_storekit_runtime_mount.py': 'c7b1b7791925e8bfcc74a22b9d628cef9700dd5a6de872770e85403e5ebe0779', 'scripts/boot_ios_simulator.py': 'd0d267c0efd00833d9cb07d01d271f251962934bedbe4b375c2fa8f92ef85f8d', 'scripts/is_storekit_launch_failure.py': 'b97d74eef0449e1ef36df1365fa9de98bef22bd6532edbd8b5a57f3607ffbb4e', 'scripts/check_ios_test_results.py': '826a25a773a34dd118da44d9d73c7884ce2b4bddc159d5ccc593c2f31f3b7f68', 'scripts/ios_storekit_test_selectors.txt': '61a37a131db3fc847fb8d4861814389cfc18d2827b68e76348869adad96bf0ca', 'ios/Tests/LocalStoreKit.xctestplan': '77d789396c8521d079002ffcc150e5b434206bd460a21c56778b4109dab5b879', 'ios/Tests/StoreKitScenarioTests.swift': 'e368f8c609514653b756db0f819a62d809b05cae8c869dd33837942b7902ea07'}
          assert subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip() == 'f4c52431b44c4491325010c1f06e73f93e43b68e'
          assert subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip() == '34c321e9e0d5a070c488a9c64bca25ad7081d4b5'
          for name, digest in expected.items():
              assert hashlib.sha256(Path(name).read_bytes()).hexdigest() == digest, name
          p = Path('.build/storekit-import-canary')
          p.mkdir(parents=True, exist_ok=True)
          (p / 'source-sha256.json').write_text(json.dumps(expected, indent=2) + '\n')
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: 43770727801
          artifact-ids: 14183494197
          path: .build/storekit-download
          merge-multiple: true
      - name: Restore and verify exact shared StoreKit products
        id: storekit-restore
        shell: bash
        run: |
          mkdir -p .build/StoreKitDerivedData/Build
          tar -xzf .build/storekit-download/storekit-test-products.tar.gz -C .build/StoreKitDerivedData/Build
          mv .build/StoreKitDerivedData/Build/storekit-product-inventory.json .build/storekit-product-inventory.json
          python3 - <<'PYCODE'
          import json, os
          from pathlib import Path
          products = Path(".build/StoreKitDerivedData/Build/Products")
          inventory = json.loads(Path(".build/storekit-product-inventory.json").read_text())
          assert inventory == {'commit': '501ce00aa75327d03ab475e70d836f89b5432b27', 'configurations': ['US English — local StoreKit', 'US Spanish app · Spanish (Mexico) offer · USA storefront'], 'xctestrun': 'RoomInTheCart-LocalStoreKit_LocalStoreKit_iphonesimulator27.1-arm64.xctestrun', 'expectedCountPerLocale': 15, 'buildSDK': 'iphonesimulator27.1', 'xcodeBuild': '27A9275'}
          assert inventory["commit"] == "501ce00aa75327d03ab475e70d836f89b5432b27"
          expected = {row["name"] for row in json.loads(Path("ios/Tests/LocalStoreKit.xctestplan").read_text())["configurations"]}
          assert len(inventory["configurations"]) == len(expected) == 2
          assert set(inventory["configurations"]) == expected
          assert inventory["expectedCountPerLocale"] == 15
          assert inventory["buildSDK"] == "iphonesimulator27.1" and inventory["xcodeBuild"] == "27A9275"
          runs = list(products.glob("*.xctestrun"))
          assert len(runs) == 1 and runs[0].name == inventory["xctestrun"]
          PYCODE
      - name: Export and import only the exact StoreKit runtime
        id: storekit-runtime
        timeout-minutes: 20
        shell: python
        run: |
          """Disposable hosted-runner-only iOS 26.2 import experiment; never run locally."""
          import json
          import os
          import platform
          import subprocess
          import time
          import uuid
          from pathlib import Path
          
          assert os.environ.get("RUNNER_ENVIRONMENT") == "github-hosted"
          assert os.environ.get("GITHUB_ACTIONS") == "true"
          assert platform.system() == "Darwin" and platform.machine() == "arm64"
          developer = "/Applications/Xcode_27.1.app/Contents/Developer"
          assert os.environ.get("DEVELOPER_DIR") == developer
          evidence = Path(".build/storekit-import-canary")
          evidence.mkdir(parents=True, exist_ok=True)
          runtime = "com.apple.CoreSimulator.SimRuntime.iOS-26-2"
          build = "23C54"
          asset_prefix = "/System/Library/AssetsV2/com_apple_MobileAsset_iOSSimulatorRuntime/"
          
          
          def capture(name, *args, timeout=None):
              result = subprocess.run(["xcrun", "simctl", *args], text=True, capture_output=True, timeout=timeout)
              (evidence / name).write_text(result.stdout)
              (evidence / (name + ".stderr.log")).write_text(result.stderr)
              result.check_returncode()
              return json.loads(result.stdout)
          
          
          def images(name, timeout=None):
              rows = capture(name, "runtime", "list", "-j", timeout=timeout)
              assert isinstance(rows, dict)
              return rows
          
          
          def targets(rows):
              return [r for r in rows.values()
                      if r.get("runtimeIdentifier") == runtime and r.get("build") == build]
          
          
          def operation(name, command):
              with (evidence / (name + ".log")).open("w") as log:
                  result = subprocess.run(command, stdout=log, stderr=subprocess.STDOUT)
              (evidence / (name + "-exit.json")).write_text(json.dumps({"exit": result.returncode}) + "\n")
              return result
          
          
          images("before.json")
          capture("before-simctl.json", "list", "-j")
          export = Path(".build/storekit-runtime-export")
          export.mkdir()
          result = operation("export", ["xcodebuild", "-downloadPlatform", "iOS", "-buildVersion", build,
                                        "-exportPath", str(export.resolve()), "-architectureVariant", "arm64"])
          # An exporter exit 70 is tolerated only provisionally: a real bundle, successful
          # privileged import, and exact Ready image checks below must still all succeed.
          assert result.returncode in (0, 70), result.returncode
          bundles = list(export.glob("*.exportedBundle"))
          assert len(bundles) == 1 and bundles[0].is_dir(), "Expected one exported platform bundle"
          files = [{"name": str(f.relative_to(bundles[0])), "bytes": f.stat().st_size}
                   for f in bundles[0].rglob("*") if f.is_file()]
          assert any(f["bytes"] > 0 for f in files), "Empty exported bundle"
          (evidence / "export-bundle.json").write_text(json.dumps({"bundle": str(bundles[0]), "files": files}, indent=2) + "\n")
          devices = capture("before-replacement-devices.json", "list", "devices", "-j")
          assert all(d["state"] == "Shutdown" for d in devices["devices"].get(runtime, []))
          replacement = targets(images("before-replacement.json"))
          # The initial image may have no 26.2 registration. Never delete an imported
          # image or another runtime/build. Validate the complete set before any mutation.
          for row in replacement:
              uuid.UUID(row["identifier"])
              assert row.get("deletable") is True, row
              assert row.get("path", "").startswith(asset_prefix), row
          asset_paths = {row["path"] for row in replacement}
          payload_names = [f["name"] for f in files if f["name"].endswith(".dmg") and f["bytes"] > 0]
          assert len(payload_names) == 1, "Expected one exact disk-image payload in exported 23C54 bundle"
          payload_name = Path(payload_names[0])
          assert not payload_name.is_absolute() and ".." not in payload_name.parts
          payload_paths = {str(Path(root) / payload_name) for root in asset_paths}
          allowed_paths = asset_paths | payload_paths
          (evidence / "original-asset-paths.json").write_text(json.dumps({
              "roots": sorted(asset_paths), "payloads": sorted(payload_paths)}, indent=2) + "\n")
          
          
          def original_rows(rows):
              # Include identity-less pending children; exact-build filters alone miss them.
              return [row for row in rows.values() if any(
                  row.get("path", "") == root or row.get("path", "").startswith(root + "/") or
                  row.get("parentMountPath") == root for root in asset_paths)]
          
          
          def validate_original(row, require_identity=True):
              uuid.UUID(row["identifier"])
              assert row.get("path") in allowed_paths, "Unexpected original-asset descendant: " + repr(row)
              if row["path"] in payload_paths:
                  assert row.get("parentMountPath") in asset_paths
                  assert row["path"] == str(Path(row["parentMountPath"]) / payload_name)
              assert row.get("deletable") is True
              for key, expected in (("runtimeIdentifier", runtime), ("build", build)):
                  assert row.get(key) in (None, expected), "Wrong runtime identity: " + repr(row)
                  if require_identity:
                      assert row.get(key) == expected, "Runtime identity still unknown: " + repr(row)
          
          
          def wait_for_scan_identity(timeout_seconds=120):
              deadline = time.monotonic() + timeout_seconds
              observations = []
              while True:
                  remaining = deadline - time.monotonic()
                  assert remaining > 0, "Recovery scan did not settle to exact 26.2/23C54 identity"
                  current = images(f"recovery-wait-{len(observations):03d}.json", timeout=min(30, remaining))
                  related = original_rows(current)
                  for row in related:
                      validate_original(row, require_identity=False)
                  assert all(row in related for row in targets(current)), "Unexpected exact-build asset after scan"
                  observations.append({"time": time.time(), "rows": related})
                  (evidence / "recovery-wait.json").write_text(json.dumps(observations, indent=2) + "\n")
                  if related and all(row.get("runtimeIdentifier") == runtime and row.get("build") == build
                                     and row.get("state") in ("Ready", "Unusable") for row in related):
                      return related
                  assert all(row.get("state") in ("Copying", "Verifying", "Mounting", "Ready", "Unusable")
                             for row in related), "Unexpected scan state"
                  time.sleep(min(5, max(0, deadline - time.monotonic())))
          
          
          def require_no_original(rows):
              assert not targets(rows), "Exact runtime was re-registered before import"
              assert not original_rows(rows), "Original asset still has a known or pending registration"
          
          
          def confirm_absence(timeout_seconds=45):
              # Scan completion can precede registration. Observe the entire settling window;
              # any exact-build OR original-path pending row fails, even without identity.
              deadline = time.monotonic() + timeout_seconds
              observations = []
              while True:
                  current = images(f"removal-confirm-{len(observations):03d}.json", timeout=30)
                  observations.append({"time": time.time(), "imageCount": len(current), "originalRows": original_rows(current)})
                  (evidence / "removal-confirm.json").write_text(json.dumps(observations, indent=2) + "\n")
                  require_no_original(current)
                  assert not any(Path(path).exists() for path in payload_paths), "Original payload reappeared"
                  if time.monotonic() >= deadline:
                      return
                  time.sleep(min(5, max(0, deadline - time.monotonic())))
          
          
          def delete_exact(rows, prefix, allow_known_purge_failure=False):
              # A rescan can change UUIDs; never expand deletion to another build or asset.
              for row in rows:
                  validate_original(row)
              for row in rows:
                  identifier = row["identifier"]
                  remaining = images(prefix + "-before-" + identifier + ".json")
                  if identifier not in remaining:
                      continue  # Removing one shared MobileAsset may already retire its twin.
                  live = remaining[identifier]
                  validate_original(live)
                  assert live in targets(remaining) and live.get("path") == row["path"]
                  name = prefix + "-" + identifier
                  result = operation(name, ["xcrun", "simctl", "runtime", "delete", identifier])
                  if result.returncode:
                      detail = (evidence / (name + ".log")).read_text()
                      expected = "Removed the runtime, but did not reclaim its MobileAsset: " + live["path"].rstrip("/") + "/"
                      known = (result.returncode == 30 and
                               "domain=com.apple.CoreSimulator.simdiskimaged.SimDiskImageError, code=30" in detail and
                               expected in detail and
                               "Run 'xcrun simctl runtime scan-and-mount' to re-register the runtime, then delete it again." in detail)
                      after_failure = images(name + "-after-failure.json")
                      if allow_known_purge_failure and known and identifier not in after_failure:
                          (evidence / "known-purge-recovery.json").write_text(json.dumps({
                              "identifier": identifier, "path": live["path"], "exit": 30,
                              "reason": "Explicit simctl recovery instruction; one bounded scan/delete retry"}) + "\n")
                          return False
                      result.check_returncode()
              return True
          
          
          if not delete_exact(replacement, "delete", allow_known_purge_failure=True):
              # simctl exposes no target-specific scan. Only this one documented recovery
              # scan is allowed; every subsequent deletion is revalidated to original assets.
              operation("purge-recovery-scan", ["xcrun", "simctl", "runtime", "scan-and-mount"]).check_returncode()
              retry_rows = wait_for_scan_identity()
              assert delete_exact(retry_rows, "purge-retry"), "Purge retry did not complete"
          require_no_original(images("after-removal.json"))
          # A catalog-only AssetData directory is allowed; the exact exported payload must
          # be gone, and neither known nor pending original-path rows may survive the scan.
          asset_state = {path: Path(path).exists() for path in sorted(payload_paths)}
          (evidence / "after-removal-payloads.json").write_text(json.dumps(asset_state, indent=2) + "\n")
          assert not any(asset_state.values()), "Original disk-image payload remains available for re-registration"
          operation("confirm-removal-scan", ["xcrun", "simctl", "runtime", "scan-and-mount"]).check_returncode()
          confirm_absence()
          operation("import", ["sudo", "-n", "/usr/bin/env", "DEVELOPER_DIR=" + developer,
                               "/usr/bin/xcodebuild", "-importPlatform", str(bundles[0].resolve())]).check_returncode()
          after_import = images("after-import.json")
          assert not original_rows(after_import), "Original asset reappeared during import"
          installed = targets(after_import)
          assert len(installed) == 1 and installed[0].get("state") == "Ready", installed
          target = installed[0]
          uuid.UUID(target["identifier"])
          path = target.get("path", "")
          assert path.startswith("/Library/Developer/CoreSimulator/") and "/Images/" in path, path
          assert Path(path).exists() and Path(target["runtimeBundlePath"]).is_dir()
          assert target.get("mountPath") and Path(target["mountPath"]).is_dir()
          assert "arm64" in target.get("supportedArchitectures", [])
          snapshot = capture("after-import-simctl.json", "list", "-j")
          matches = [r for r in snapshot["runtimes"] if r["identifier"] == runtime]
          exact = [r for r in matches if r["buildversion"] == build]
          assert len(exact) == 1 and exact[0].get("isAvailable") is True
          actual = exact[0]
          assert actual["version"] == "26.2" and actual["bundlePath"] == target["runtimeBundlePath"]
          (evidence / "target.json").write_text(json.dumps(target, indent=2) + "\n")
          device_target = actual["bundlePath"] if len(matches) > 1 else runtime
          created = subprocess.check_output(["xcrun", "simctl", "create", "RITC-StoreKit-es",
                                            "com.apple.CoreSimulator.SimDeviceType.iPhone-17", device_target], text=True).strip()
          created = str(uuid.UUID(created)).upper()
          assert created not in {d["udid"].upper() for ds in snapshot["devices"].values() for d in ds}
          (evidence / "created-device.json").write_text(json.dumps({"udid": created, "runtime": runtime, "build": build}) + "\n")
          with Path(os.environ["GITHUB_ENV"]).open("a") as output:
              output.write(f"CI_IPHONE_RUNTIME={runtime}\nSTOREKIT_OS_VERSION=26.2\nSTOREKIT_OS_BUILD={build}\n")
              output.write(f"SIMULATOR_ID={created}\nSTOREKIT_CREATED_SIMULATOR={created}\n")
          print("Imported exactly one Ready iOS 26.2/23C54 image; original Spanish scenarios may execute.")
      - name: Run StoreKit scenarios
        id: storekit-native
        if: ${{ !cancelled() && steps.storekit-restore.outcome == 'success' && steps.storekit-runtime.outcome == 'success' }}
        timeout-minutes: 35
        shell: bash
        run: |
          set -o pipefail
          output=".build/storekit-$STOREKIT_LOCALE"
          mkdir -p "$output"
          if [ "$STOREKIT_OS_BUILD" = 23C54 ]; then
            python3 scripts/check_storekit_runtime_mount.py 2>&1 | tee "$output/StoreKitMount.log"
          fi
          python3 scripts/boot_ios_simulator.py "$SIMULATOR_ID" 2>&1 | tee "$output/StoreKitBoot.log"
          test_runs=(.build/StoreKitDerivedData/Build/Products/*.xctestrun)
          test "${#test_runs[@]}" -eq 1
          test -f "${test_runs[0]}"
          run_storekit() {
            local version build
            version=$(xcrun simctl getenv "$SIMULATOR_ID" SIMULATOR_RUNTIME_VERSION) || return 1
            build=$(xcrun simctl getenv "$SIMULATOR_ID" SIMULATOR_RUNTIME_BUILD_VERSION) || return 1
            printf 'Booted %s iOS %s/%s; required %s/%s\n' "$SIMULATOR_ID" "$version" "$build" \
              "$STOREKIT_OS_VERSION" "$STOREKIT_OS_BUILD" | tee -a "$output/StoreKitBoot.log"
            if [ "$version" != "$STOREKIT_OS_VERSION" ] || [ "$build" != "$STOREKIT_OS_BUILD" ]; then
              return 1
            fi
            xcodebuild -xctestrun "${test_runs[0]}" -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
              -only-test-configuration "$STOREKIT_CONFIGURATION" -parallel-testing-enabled NO \
              -test-timeouts-enabled YES -default-test-execution-time-allowance 120 \
              -maximum-test-execution-time-allowance 120 -collect-test-diagnostics on-failure \
              -resultBundlePath "$output/StoreKit.xcresult" \
              test-without-building 2>&1 | tee "$output/StoreKit.log"
          }
          native_status=0
          run_storekit || native_status=$?
          if [ "$native_status" -ne 65 ] && [ "$native_status" -ne 70 ]; then exit "$native_status"; fi
          if xcrun xcresulttool get test-results tests --path "$output/StoreKit.xcresult" --compact > "$output/first-tests.json" &&
             python3 scripts/is_storekit_launch_failure.py "$output/StoreKit.log" "$output/first-tests.json" "$native_status" "$SIMULATOR_ID"; then
            mkdir "$output/launch-failure"
            mv "$output/StoreKit.xcresult" "$output/StoreKit.log" "$output/first-tests.json" "$output/launch-failure/"
            if [ "$native_status" -eq 65 ]; then
              echo 'Restarting the simulator after a pre-test StoreKit launch service death.'
              python3 scripts/boot_ios_simulator.py --restart "$SIMULATOR_ID" 2>&1 | tee "$output/launch-failure/StoreKitRecoveryBoot.log"
            else
              echo 'Rechecking the same simulator after Xcode listed no concrete iOS Simulator destinations.'
              python3 scripts/boot_ios_simulator.py "$SIMULATOR_ID" 2>&1 | tee "$output/launch-failure/StoreKitRecoveryBoot.log"
            fi
            run_storekit
          else
            exit "$native_status"
          fi
      - name: Export StoreKit results even after a failed scenario
        id: storekit-results
        if: ${{ !cancelled() && steps.storekit-native.outcome != 'skipped' }}
        shell: bash
        run: |
          test -d ".build/storekit-$STOREKIT_LOCALE/StoreKit.xcresult"
          xcrun xcresulttool get test-results summary --path ".build/storekit-$STOREKIT_LOCALE/StoreKit.xcresult" --compact > ".build/storekit-$STOREKIT_LOCALE/storekit-summary.json"
          xcrun xcresulttool get test-results tests --path ".build/storekit-$STOREKIT_LOCALE/StoreKit.xcresult" --compact > ".build/storekit-$STOREKIT_LOCALE/storekit-tests.json"
      - name: Verify exact StoreKit configuration and all scenario results
        id: storekit-verify
        if: ${{ !cancelled() && steps.storekit-results.outcome == 'success' }}
        shell: bash
        run: |
          set -o pipefail
          python3 - <<'PYCODE'
          import json, os
          from pathlib import Path
          summary = json.loads((Path(".build") / ("storekit-" + os.environ["STOREKIT_LOCALE"]) / "storekit-summary.json").read_text())
          configurations = summary["devicesAndConfigurations"]
          assert len(configurations) == 1
          configuration = configurations[0]
          assert configuration["testPlanConfiguration"]["configurationName"] == os.environ["STOREKIT_CONFIGURATION"]
          device = configuration["device"]
          assert device["osVersion"] == os.environ["STOREKIT_OS_VERSION"] and device["osBuildNumber"] == os.environ["STOREKIT_OS_BUILD"], device
          assert device["architecture"] == "arm64" and device["modelName"] == "iPhone 17" and device["platform"] == "iOS Simulator", device
          assert device["deviceId"].upper() == os.environ["SIMULATOR_ID"], device
          PYCODE
          python3 scripts/check_ios_test_results.py --selectors scripts/ios_storekit_test_selectors.txt --expected-count 15 \
            --summary ".build/storekit-$STOREKIT_LOCALE/storekit-summary.json" --tests ".build/storekit-$STOREKIT_LOCALE/storekit-tests.json" \
            --result-bundle ".build/storekit-$STOREKIT_LOCALE/StoreKit.xcresult" --test-log ".build/storekit-$STOREKIT_LOCALE/StoreKit.log" 2>&1 | tee ".build/storekit-$STOREKIT_LOCALE/storekit-verification.txt"
      - name: Require stable imported image and no recovery or runner restart
        id: runtime-stability
        if: ${{ !cancelled() && steps.storekit-runtime.outcome == 'success' }}
        shell: python
        run: |
          import json, subprocess
          from pathlib import Path
          p = Path('.build/storekit-import-canary')
          raw = subprocess.check_output(['xcrun', 'simctl', 'runtime', 'list', '-j'], text=True)
          (p / 'after-tests.json').write_text(raw)
          current = json.loads(raw)
          roots = json.loads((p / 'original-asset-paths.json').read_text())['roots']
          assert not any(row.get('path', '') == root or row.get('path', '').startswith(root + '/') or row.get('parentMountPath') == root for row in current.values() for root in roots), 'Original asset reappeared after tests'
          before = json.loads((p / 'target.json').read_text())
          selected = [r for r in current.values() if r.get('runtimeIdentifier') == before['runtimeIdentifier'] and r.get('build') == before['build']]
          assert len(selected) == 1 and selected[0]['identifier'] == before['identifier']
          after = selected[0]
          assert after['state'] == 'Ready'
          for key in ('build', 'runtimeIdentifier', 'path', 'mountPath', 'runtimeBundlePath'):
              assert before.get(key) == after.get(key), key
          assert Path(after['runtimeBundlePath']).is_dir() and Path(after['mountPath']).is_dir()
          output = Path('.build/storekit-es')
          assert not (output / 'launch-failure').exists(), 'Recovery needed: not a clean import qualification'
          assert 'Restarting after unexpected exit' not in (output / 'StoreKit.log').read_text()
          (p / 'stability-passed.json').write_text(json.dumps({'identifier': after['identifier'], 'mountPath': after['mountPath'], 'recovery': False}) + '\n')
      - name: Retain final runtime state and cleanup trace
        if: always()
        timeout-minutes: 3
        run: |
          mkdir -p .build/storekit-import-canary
          xcrun simctl runtime list -j > .build/storekit-import-canary/final.json || true
          xcrun simctl list -j > .build/storekit-import-canary/final-simctl.json || true
          python3 - <<'PYCODE'
          import json, os, plistlib, subprocess
          from pathlib import Path
          p = Path('.build/storekit-import-canary')
          definition = p / 'original-asset-paths.json'
          paths = json.loads(definition.read_text()) if definition.exists() else {'roots': [], 'payloads': []}
          inventory = {'paths': {}, 'attachedImages': []}
          for name in sorted(set(paths['roots'] + paths['payloads'] + [str(Path(root) / 'Restore') for root in paths['roots']])):
              path = Path(name)
              try:
                  stat = path.lstat()
                  value = {'mode': stat.st_mode, 'bytes': stat.st_size, 'symlink': path.is_symlink()}
                  if path.is_dir():
                      value['children'] = sorted(child.name for child in path.iterdir())[:40]
                  inventory['paths'][name] = value
              except OSError as error:
                  inventory['paths'][name] = {'error': str(error), 'errno': error.errno}
          try:
              result = subprocess.run(['hdiutil', 'info', '-plist'], capture_output=True, timeout=30)
              inventory['hdiutilExit'] = result.returncode
              inventory['hdiutilStderr'] = result.stderr.decode(errors='replace')
              if result.returncode == 0:
                  images = plistlib.loads(result.stdout).get('images', [])
                  inventory['attachedImages'] = [
                      {key: row[key] for key in ('image-path', 'system-entities', 'image-type') if key in row}
                      for row in images if any(row.get('image-path', '') == root or row.get('image-path', '').startswith(root + '/') for root in paths['roots'])]
          except (OSError, ValueError, subprocess.SubprocessError) as error:
              inventory['hdiutilError'] = str(error)
          (p / 'final-asset-inventory.json').write_text(json.dumps(inventory, indent=2) + '\n')
          PYCODE
          /usr/bin/log show --style compact --last 1h --predicate 'process == "simdiskimaged" OR process == "CoreSimulatorService"' > .build/storekit-import-canary/runtime-events.log 2>&1 || true
      - name: Remove only the simulator created by this diagnostic
        if: ${{ always() && env.STOREKIT_CREATED_SIMULATOR != '' }}
        timeout-minutes: 2
        run: xcrun simctl delete "$STOREKIT_CREATED_SIMULATOR"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: storekit-import-es-${{ github.run_attempt }}
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error
          path: |
            .build/storekit-import-canary/
            .build/storekit-es/
            .build/storekit-product-inventory.json
      - name: Require the complete StoreKit locale outcome
        id: storekit-locale-gate
        if: always()
        env:
          STOREKIT_STEP_RESULTS: ${{ toJSON(steps) }}
        run: |
          python3 - <<'PYCODE'
          import json, os
          steps = json.loads(os.environ["STOREKIT_STEP_RESULTS"])
          required = ["storekit-runtime", "storekit-restore", "storekit-native", "storekit-results", "storekit-verify", "runtime-stability"]
          failures = {name: steps.get(name, {}).get("outcome", "missing") for name in required
                      if steps.get(name, {}).get("outcome") != "success"}
          if failures:
              raise SystemExit(f"StoreKit locale checks did not pass: {failures}")
          PYCODE