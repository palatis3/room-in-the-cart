name: Simulator runtime cleanup canary
run-name: Runtime cleanup experiment · original UI09
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: ritc-runtime-cleanup-canary
  cancel-in-progress: false
jobs:
  runtime:
    runs-on: xcode-27
    concurrency:
      group: ritc-macos-slot-3
      cancel-in-progress: false
    timeout-minutes: 55
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
      CI_IPHONE_RUNTIME: com.apple.CoreSimulator.SimRuntime.iOS-27-0
      CI_IPHONE_NAME: iPhone 17
      TEST_SHARD: ui-09
      EXPECTED_TEST_COUNT: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: f4c52431b44c4491325010c1f06e73f93e43b68e
          persist-credentials: false
      - name: Drain only unusable duplicate runtime registrations before boot
        timeout-minutes: 5
        shell: python
        run: |
          import json, os, platform, subprocess, uuid
          from pathlib import Path
          assert os.environ.get('RUNNER_ENVIRONMENT') == 'github-hosted'
          assert os.environ.get('GITHUB_ACTIONS') == 'true'
          assert platform.system() == 'Darwin' and platform.machine() == 'arm64'
          evidence = Path('.build/runtime-canary'); evidence.mkdir(parents=True)
          def capture(name):
              raw = subprocess.check_output(['xcrun','simctl','runtime','list','-j'],text=True)
              (evidence / name).write_text(raw)
              value = json.loads(raw)
              assert isinstance(value, dict)
              return value
          def identity(row):
              return tuple(row.get(k) for k in ('platformIdentifier','runtimeIdentifier','build'))
          initial = capture('before.json')
          plan = []
          for identifier, row in initial.items():
              if row.get('state') != 'Unusable' or row.get('unusableSubstate') != 'Cryptex Mount Preferred':
                  continue
              assert row.get('identifier') == identifier and row.get('deletable') is True
              uuid.UUID(identifier)
              key = identity(row)
              assert all(isinstance(v,str) and v for v in key)
              twins = [r for r in initial.values() if identity(r) == key and r.get('state') == 'Ready']
              assert len(twins) == 1, 'Expected one Ready twin before deleting a duplicate'
              twin = twins[0]
              assert twin['identifier'] != identifier
              assert Path(twin['runtimeBundlePath']).is_dir()
              plan.append({'remove':identifier,'keep':twin['identifier'],'identity':key})
          (evidence/'plan.json').write_text(json.dumps(plan,indent=2)+'\n')
          for item in plan:
              result = subprocess.run(['xcrun','simctl','runtime','delete',item['remove'],'--keep-asset'],capture_output=True,text=True)
              (evidence/(item['remove']+'.log')).write_text(result.stdout+result.stderr)
              assert result.returncode == 0, 'Duplicate removal failed; retain evidence and stop'
          after = capture('after-cleanup.json')
          for item in plan:
              assert item['remove'] not in after
              twin = after[item['keep']]
              assert twin['state'] == 'Ready' and identity(twin) == tuple(item['identity'])
              assert Path(twin['runtimeBundlePath']).is_dir()
          targets = [r for r in after.values() if r.get('runtimeIdentifier') == os.environ['CI_IPHONE_RUNTIME'] and r.get('build') == '24A434' and r.get('state') == 'Ready']
          assert len(targets) == 1
          (evidence/'target.json').write_text(json.dumps(targets[0],indent=2)+'\n')
          print('Removed',len(plan),'unusable duplicates; Ready twins and target retained.')
      - name: Verify exact toolchain
        run: bash scripts/check_ci_xcode27.sh
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: 43770727863
          artifact-ids: 14184538289
          path: .build/download
          merge-multiple: true
      - name: Restore original products and selection
        run: |
          set -euo pipefail
          mkdir -p .build/DerivedData/Build
          /usr/bin/compression_tool -decode -A lzfse -t 2 -i .build/download/iphone-test-products.tar.lzfse | tar -xf - -C .build/DerivedData/Build
          mv .build/DerivedData/Build/test-plan .build/test-plan
          xcrun simctl list devices available -j | python3 scripts/select_ci_iphone.py --create-owned .build/test-simulator-ownership.json
      - name: Boot the owned iPhone
        timeout-minutes: 8
        run: python3 scripts/boot_ios_simulator.py "$SIMULATOR_ID"
      - name: Run the original eight interrupted UI09 cases
        timeout-minutes: 40
        run: bash scripts/run_ios_test_shard.sh
      - name: Require stable runtime identity and no runner restart
        shell: python
        run: |
          import json,subprocess
          from pathlib import Path
          p=Path('.build/runtime-canary')
          raw=subprocess.check_output(['xcrun','simctl','runtime','list','-j'],text=True)
          (p/'after-tests.json').write_text(raw)
          current=json.loads(raw); before=json.loads((p/'target.json').read_text())
          after=current[before['identifier']]
          assert after['state']=='Ready'
          for key in ('build','runtimeIdentifier','mountPath','runtimeBundlePath'):
              assert before.get(key)==after.get(key), key
          assert Path(after['runtimeBundlePath']).is_dir()
          assert not Path('.build/Tests-retry.log').exists()
          assert 'Restarting after unexpected exit' not in Path('.build/Tests.log').read_text()
      - name: Retain runtime state and cleanup trace
        if: always()
        timeout-minutes: 3
        run: |
          mkdir -p .build/runtime-canary
          xcrun simctl runtime list -j > .build/runtime-canary/final.json || true
          /usr/bin/log show --style compact --last 1h --predicate 'process == "simdiskimaged" OR process == "CoreSimulatorService"' > .build/runtime-canary/runtime-events.log 2>&1 || true
      - name: Clean up only the owned simulator
        if: always()
        timeout-minutes: 2
        run: python3 scripts/select_ci_iphone.py --cleanup-owned .build/test-simulator-ownership.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: runtime-cleanup-ui09-${{ github.run_attempt }}
          include-hidden-files: true
          retention-days: 7
          path: |
            .build/runtime-canary
            .build/Tests*
            .build/test-plan
            .build/test-*.json
