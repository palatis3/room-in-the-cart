name: iOS 27 direct DMG diagnostic
run-name: "iOS 27 direct DMG \xB7 unchanged produce-focus journey"
permissions:
  contents: read
  actions: read
concurrency:
  group: ritc-ios27-direct-dmg-canary
  cancel-in-progress: false
jobs:
  runtime:
    runs-on: xcode-27
    concurrency:
      group: ritc-macos-slot-2
      cancel-in-progress: false
      queue: max
    timeout-minutes: 75
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
      CI_IPHONE_RUNTIME: com.apple.CoreSimulator.SimRuntime.iOS-27-0
      CI_IPHONE_NAME: iPhone 17
      TEST_SHARD: produce-focus
      EXPECTED_TEST_COUNT: 1
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: a746ff60d13cfae205a743a481ed9248ef559d54
        persist-credentials: false
    - name: Verify exact toolchain
      run: bash scripts/check_ci_xcode27.sh
    - name: Import exact iOS 27 standalone disk image
      id: imported-runtime
      timeout-minutes: 20
      shell: bash
      run: "set -euo pipefail\nmkdir -p .build\ncat > .build/prepare_github_ios_runtime.py <<'RITC_RUNTIME_HELPER'\n\"\"\"\
        Prepare the pinned GitHub iOS 27 runtime and verify its stability after tests.\"\"\"\nimport argparse\nimport json\n\
        import os\nimport platform\nimport subprocess\nimport re\nimport time\nimport uuid\nfrom pathlib import Path\n\nevidence\
        \ = Path('.build/github-ios-runtime')\nruntime = 'com.apple.CoreSimulator.SimRuntime.iOS-27-0'\nbuild = '24A434'\n\
        \ndef capture(name, timeout=30):\n    raw = subprocess.check_output(['xcrun', 'simctl', 'runtime', 'list', '-j'],\
        \ text=True, timeout=timeout)\n    (evidence / name).write_text(raw)\n    value = json.loads(raw)\n    assert isinstance(value,\
        \ dict)\n    return value\n\ndef targets(rows):\n    return [r for r in rows.values() if r.get('runtimeIdentifier')\
        \ == runtime and r.get('build') == build]\n\ndef prepare():\n    before = capture('before.json')\n    assert any(r.get('state')\
        \ == 'Ready' for r in targets(before))\n    export = Path('.build/runtime-export')\n    export.mkdir()\n    with (evidence\
        \ / 'export.log').open('w') as log:\n        result = subprocess.run(['xcodebuild', '-downloadPlatform', 'iOS', '-buildVersion',\
        \ build,\n                                 '-exportPath', str(export.resolve()), '-architectureVariant', 'arm64'],\n\
        \                                stdout=log, stderr=subprocess.STDOUT)\n    (evidence / 'export-exit.json').write_text(json.dumps({'exit':\
        \ result.returncode}) + '\\n')\n    # The documented exporter may return 70 even when its exported bundle exists.\n\
        \    # A real import and exact registration check below remain mandatory.\n    assert result.returncode in (0, 70)\n\
        \    bundles = list(export.glob('*.exportedBundle'))\n    assert len(bundles) == 1 and bundles[0].is_dir(), 'Expected\
        \ one exported platform bundle'\n    assert any(f.is_file() and f.stat().st_size > 0 for f in bundles[0].rglob('*'))\n\
        \    (evidence / 'export-bundle.json').write_text(json.dumps({'bundle': str(bundles[0]),\n        'files': [{'name':\
        \ str(f.relative_to(bundles[0])), 'bytes': f.stat().st_size}\n                  for f in bundles[0].rglob('*') if\
        \ f.is_file()]}, indent=2) + '\\n')\n    devices = json.loads(subprocess.check_output(['xcrun', 'simctl', 'list',\
        \ 'devices', '-j'], text=True))\n    assert all(d['state'] == 'Shutdown' for d in devices['devices'].get(runtime,\
        \ []))\n    current = capture('before-replacement.json')\n    replacement = targets(current)\n    assert replacement\n\
        \    for row in replacement:\n        uuid.UUID(row['identifier'])\n        assert current.get(row['identifier'])\
        \ == row\n        assert row.get('deletable') is True\n        assert row.get('path', '').startswith('/System/Library/AssetsV2/com_apple_MobileAsset_iOSSimulatorRuntime/')\n\
        \    asset_paths = {row['path'] for row in replacement}\n\n    def original_rows(rows):\n        # A scan can expose\
        \ pending children before their runtime identity is known.\n        return [row for row in rows.values() if any(\n\
        \            row.get('path', '') == root or row.get('path', '').startswith(root + '/')\n            or row.get('parentMountPath')\
        \ == root for root in asset_paths)]\n\n    def validate(row, payload_name=None, pending=False):\n        uuid.UUID(row['identifier'])\n\
        \        path = row.get('path')\n        if path not in asset_paths:\n            parent = row.get('parentMountPath')\n\
        \            assert payload_name is not None and parent in asset_paths\n            assert path == str(Path(parent)\
        \ / payload_name), 'Unexpected original-asset child'\n        assert row.get('deletable') is True\n        for key,\
        \ expected in (('runtimeIdentifier', runtime), ('build', build)):\n            assert row.get(key) == expected or\
        \ (pending and row.get(key) is None), row\n\n    def wait_for_deletion(row, label, payload_name):\n        deadline\
        \ = time.monotonic() + 210\n        attempt = 0\n        while True:\n            remaining = deadline - time.monotonic()\n\
        \            assert remaining > 0, 'Runtime deletion did not finish within 210 seconds'\n            rows = capture(label\
        \ + '-wait-' + str(attempt) + '.json', timeout=min(30, remaining))\n            live = rows.get(row['identifier'])\n\
        \            if live is None:\n                return\n            validate(live, payload_name)\n            assert\
        \ live['identifier'] == row['identifier'] and live['path'] == row['path']\n            assert live.get('state') ==\
        \ 'Deleting', 'Deleting runtime changed state'\n            time.sleep(min(5, max(0, deadline - time.monotonic())))\n\
        \            attempt += 1\n\n    def delete_exact(rows, prefix, payload_name=None, allow_recovery=False):\n      \
        \  # Validate every row before the first deletion, including scan-discovered rows.\n        for row in rows:\n   \
        \         validate(row, payload_name)\n        for row in rows:\n            identifier = row['identifier']\n    \
        \        remaining = capture(prefix + '-current-' + identifier + '.json')\n            if identifier not in remaining:\n\
        \                continue\n            active = remaining[identifier]\n            validate(active, payload_name)\n\
        \            assert all(active.get(k) == row.get(k) for k in\n                       ('identifier', 'runtimeIdentifier',\
        \ 'build', 'path', 'deletable'))\n            label = prefix + '-' + identifier\n            if active.get('state')\
        \ == 'Deleting':\n                wait_for_deletion(active, label, payload_name)\n                continue\n     \
        \       log_path = evidence / (label + '.log')\n            with log_path.open('w') as log:\n                result\
        \ = subprocess.run(['xcrun', 'simctl', 'runtime', 'delete', identifier],\n                                       \
        \ stdout=log, stderr=subprocess.STDOUT, timeout=60)\n            (evidence / (label + '-exit.json')).write_text(json.dumps({'exit':\
        \ result.returncode}) + '\\n')\n            if result.returncode:\n                detail = log_path.read_text()\n\
        \                domain = 'domain=com.apple.CoreSimulator.simdiskimaged.SimDiskImageError, code='\n              \
        \  after_failure = capture(label + '-after-failure.json')\n                deleting = (result.returncode == 24 and\
        \ domain + '24)' in detail and\n                            re.search(r'Attempting to delete image: ' + re.escape(identifier)\
        \ +\n                                      r' \\(Please retry in [0-9]+s, if the image is not removed\\)', detail))\n\
        \                if deleting and identifier in after_failure:\n                    failed_row = after_failure[identifier]\n\
        \                    validate(failed_row, payload_name)\n                    assert failed_row['identifier'] == identifier\
        \ and failed_row['path'] == active['path']\n                    assert failed_row.get('state') == 'Deleting'\n   \
        \                 wait_for_deletion(active, label, payload_name)\n                    continue\n                expected\
        \ = 'Removed the runtime, but did not reclaim its MobileAsset: ' + active['path'].rstrip('/') + '/'\n            \
        \    purge_failure = (result.returncode == 30 and domain + '30)' in detail and\n                                 expected\
        \ in detail and\n                                 \"Run 'xcrun simctl runtime scan-and-mount' to re-register the runtime,\
        \ then delete it again.\" in detail)\n                if allow_recovery and purge_failure and identifier not in after_failure:\n\
        \                    return False\n                result.check_returncode()\n            after_delete = capture(label\
        \ + '-after-delete.json')\n            if identifier in after_delete:\n                live = after_delete[identifier]\n\
        \                validate(live, payload_name)\n                assert live['identifier'] == identifier and live['path']\
        \ == active['path']\n                assert live.get('state') == 'Deleting', 'Successful deletion left an unexpected\
        \ registration'\n                wait_for_deletion(active, label, payload_name)\n        return True\n\n    recovered\
        \ = not delete_exact(replacement, 'replace', allow_recovery=True)\n    if recovered:\n        payloads = [f.relative_to(bundles[0])\
        \ for f in bundles[0].rglob('*.dmg')\n                    if f.is_file() and f.stat().st_size > 0]\n        assert\
        \ len(payloads) == 1, 'Expected one exact exported disk-image payload'\n        payload_name = payloads[0]\n     \
        \   assert not payload_name.is_absolute() and '..' not in payload_name.parts\n        with (evidence / 'purge-recovery-scan.log').open('w')\
        \ as log:\n            subprocess.run(['xcrun', 'simctl', 'runtime', 'scan-and-mount'],\n                        \
        \   stdout=log, stderr=subprocess.STDOUT, timeout=60, check=True)\n        deadline = time.monotonic() + 120\n   \
        \     attempt = 0\n        while True:\n            remaining = deadline - time.monotonic()\n            assert remaining\
        \ > 0, 'Recovery scan did not settle to exact iOS 27.0/24A434 identity'\n            rows = capture('recovery-scan-'\
        \ + str(attempt) + '.json', timeout=min(30, remaining))\n            related = original_rows(rows)\n            for\
        \ row in related:\n                assert rows.get(row['identifier']) == row\n                validate(row, payload_name,\
        \ pending=True)\n            assert all(row in related for row in targets(rows)), 'Unexpected target asset after scan'\n\
        \            if related and all(row.get('runtimeIdentifier') == runtime and row.get('build') == build\n          \
        \                     and row.get('state') in ('Ready', 'Unusable') for row in related):\n                break\n\
        \            assert all(row.get('state') in ('Copying', 'Verifying', 'Mounting', 'Ready', 'Unusable')\n          \
        \             for row in related), 'Unexpected scan state'\n            time.sleep(min(5, max(0, deadline - time.monotonic())))\n\
        \            attempt += 1\n        assert delete_exact(related, 'purge-retry', payload_name), 'Purge retry failed'\n\
        \        payload_paths = [Path(root) / payload_name for root in asset_paths]\n        assert not any(path.exists()\
        \ for path in payload_paths), 'Original disk-image payload remains'\n        with (evidence / 'confirm-removal-scan.log').open('w')\
        \ as log:\n            subprocess.run(['xcrun', 'simctl', 'runtime', 'scan-and-mount'],\n                        \
        \   stdout=log, stderr=subprocess.STDOUT, timeout=60, check=True)\n        # The qualified scan can register a pending\
        \ row after the command returns.\n        deadline = time.monotonic() + 45\n        attempt = 0\n        while True:\n\
        \            rows = capture('removal-confirm-' + str(attempt) + '.json')\n            assert not targets(rows) and\
        \ not original_rows(rows), 'Original asset reappeared after retry'\n            assert not any(path.exists() for path\
        \ in payload_paths), 'Original payload reappeared'\n            if time.monotonic() >= deadline:\n               \
        \ break\n            time.sleep(min(5, max(0, deadline - time.monotonic())))\n            attempt += 1\n    after_removal\
        \ = capture('after-removal.json')\n    assert not targets(after_removal) and not original_rows(after_removal)\n  \
        \  payloads = [f for f in bundles[0].rglob('*.dmg') if f.is_file() and f.stat().st_size > 0]\n    assert len(payloads)\
        \ == 1, 'Expected one exact exported disk-image payload'\n    disk_image = payloads[0]\n    (evidence / 'import-input.json').write_text(json.dumps({\n\
        \        'mode': 'direct-dmg', 'path': str(disk_image.resolve()),\n        'relativePayload': str(disk_image.relative_to(bundles[0]))})\
        \ + '\\n')\n    with (evidence / 'import.log').open('w') as log:\n        subprocess.run(['sudo', '-n', '/usr/bin/env',\n\
        \                        'DEVELOPER_DIR=/Applications/Xcode_27.1.app/Contents/Developer',\n                      \
        \  '/usr/bin/xcodebuild', '-importPlatform', str(disk_image.resolve())],\n                       stdout=log, stderr=subprocess.STDOUT,\
        \ check=True)\n    after = capture('after-import.json')\n    assert not original_rows(after), 'Original asset reappeared\
        \ during import'\n    installed = targets(after)\n    assert len(installed) == 1 and installed[0].get('state') ==\
        \ 'Ready'\n    target = installed[0]\n    assert target.get('kind') == 'Disk Image', target\n    assert not target.get('parentMountPath')\
        \ and not target.get('parentIdentifier'), target\n    assert target.get('mountPath') and Path(target['mountPath']).is_dir()\n\
        \    path = target.get('path', '')\n    assert path.startswith('/Library/Developer/CoreSimulator/') and '/Images/'\
        \ in path, path\n    assert Path(path).exists() and Path(target['runtimeBundlePath']).is_dir()\n    assert 'arm64'\
        \ in target.get('supportedArchitectures', [])\n    (evidence / 'target.json').write_text(json.dumps(target, indent=2)\
        \ + '\\n')\n    print('Imported iOS 27.0/24A434 runtime verified.')\n\n\ndef verify():\n    current = capture('after-tests.json')\n\
        \    before = json.loads((evidence / 'target.json').read_text())\n    # Preserve physical availability even when registry\
        \ mount metadata vanishes.\n    # This is diagnostic evidence only: the identity/mount assertions below stay strict.\n\
        \    filesystem = {'observedAt': time.time(), 'paths': {}}\n    for key in ('path', 'mountPath', 'runtimeBundlePath'):\n\
        \        value = before.get(key)\n        filesystem['paths'][key] = {\n            'path': value,\n            'exists':\
        \ Path(value).exists() if value else None,\n            'isDirectory': Path(value).is_dir() if value else None,\n\
        \        }\n        if key == 'mountPath':\n            filesystem['paths'][key]['isMount'] = os.path.ismount(value)\
        \ if value else None\n    (evidence / 'verification-filesystem.json').write_text(json.dumps(filesystem, indent=2)\
        \ + '\\n')\n    installed = targets(current)\n    assert len(installed) == 1, 'Expected exactly one target registration'\n\
        \    after = installed[0]\n    assert after['state'] == 'Ready'\n    assert after.get('kind') == 'Disk Image', after\n\
        \    assert not after.get('parentMountPath') and not after.get('parentIdentifier'), after\n    assert after.get('mountPath')\
        \ and Path(after['mountPath']).is_dir()\n    for key in ('identifier', 'build', 'runtimeIdentifier', 'path', 'mountPath',\
        \ 'runtimeBundlePath'):\n        assert before.get(key) == after.get(key), 'Runtime changed during tests: ' + key\n\
        \    assert Path(after['path']).exists() and Path(after['runtimeBundlePath']).is_dir()\n    print('Imported runtime\
        \ identity, mount and bundle retained.')\n\n\ndef main():\n    parser = argparse.ArgumentParser(description=__doc__)\n\
        \    parser.add_argument('operation', choices=('prepare', 'verify'))\n    args = parser.parse_args()\n    assert os.environ.get('RUNNER_ENVIRONMENT')\
        \ == 'github-hosted'\n    assert os.environ.get('GITHUB_ACTIONS') == 'true'\n    assert platform.system() == 'Darwin'\
        \ and platform.machine() == 'arm64'\n    assert os.environ.get('CI_IPHONE_RUNTIME') == runtime\n    assert os.environ.get('DEVELOPER_DIR')\
        \ == '/Applications/Xcode_27.1.app/Contents/Developer'\n    evidence.mkdir(parents=True, exist_ok=True)\n    if args.operation\
        \ == 'prepare':\n        prepare()\n    else:\n        verify()\n\n\nif __name__ == '__main__':\n    main()\nRITC_RUNTIME_HELPER\n\
        printf '%s  %s\\n' '520bd028ffae003da1fe2a3077e96e0d401dd0ee2a776b5e282708434b462e3c' '.build/prepare_github_ios_runtime.py'\
        \ | shasum -a 256 -c -\npython3 .build/prepare_github_ios_runtime.py prepare\n"
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        github-token: ${{ github.token }}
        run-id: 43798242948
        artifact-ids: 14196353082
        path: .build/download
        merge-multiple: true
    - name: Verify a746 products and select original failed produce journey
      run: "set -euo pipefail\ntest \"$(git rev-parse HEAD)\" = a746ff60d13cfae205a743a481ed9248ef559d54\ntest \"$(git rev-parse\
        \ 'HEAD^{tree}')\" = 1c579cedc8c604634f73ed0a06a0660f0c595461\nprintf '%s  %s\\n' 'f3247a85f5e9497f9b87591c2337725160ca43f96bdac8156dd84567ea4098ba'\
        \ '.build/download/iphone-test-products.tar.lzfse' | shasum -a 256 -c -\nmkdir -p .build/DerivedData/Build\n/usr/bin/compression_tool\
        \ -decode -A lzfse -t 2 -i .build/download/iphone-test-products.tar.lzfse | tar -xf - -C .build/DerivedData/Build\n\
        mv .build/DerivedData/Build/test-plan .build/test-plan\nprintf '%s  %s\\n' '1dfe6eb9293b1c42d0f3df7d9ee888580d54d527f5a10738df3e55f44a92713d'\
        \ '.build/test-plan/ui-09.txt' | shasum -a 256 -c -\ngrep -Fx 'RoomInTheCartUITests/ContextualNavigationUITests/testUnknownProduceWeightUsesSavedWholePickupCapAndBillingIncrement'\
        \ .build/test-plan/ui-03.txt > .build/test-plan/produce-focus.txt\ntest \"$(wc -l < .build/test-plan/produce-focus.txt\
        \ | tr -d ' ')\" = 1\ncat > .build/select_ci_iphone.py <<'RITC_OWNERSHIP_HELPER'\n#!/usr/bin/env python3\n\"\"\"Select\
        \ an image iPhone, or opt in to a job-owned device with identical type/runtime.\"\"\"\nimport argparse\nimport json\n\
        import os\nfrom pathlib import Path\nimport re\nimport subprocess\nimport sys\nfrom uuid import UUID, uuid4\n\n\n\
        def select_iphone(devices_by_runtime, required_runtime=None, required_name=None):\n    if bool(required_runtime) !=\
        \ bool(required_name):\n        raise ValueError('Pin both CI_IPHONE_RUNTIME and CI_IPHONE_NAME, or neither')\n  \
        \  candidates = []\n    for runtime, devices in devices_by_runtime.items():\n        if \".iOS-\" not in runtime:\n\
        \            continue\n        if required_runtime and runtime != required_runtime:\n            continue\n      \
        \  version = tuple(map(int, runtime.split(\".iOS-\", 1)[1].split(\"-\")))\n        for device in devices:\n      \
        \      if required_name and device['name'] != required_name:\n                continue\n            if device[\"name\"\
        ].startswith(\"iPhone\") and device.get(\"isAvailable\"):\n                candidates.append((version, runtime, device))\n\
        \    if not candidates:\n        raise ValueError(\"No available iPhone simulator matching the requested runtime/device\"\
        )\n    _, runtime, device = max(candidates, key=lambda item: (item[0], item[2][\"name\"] == \"iPhone 17\"))\n    return\
        \ runtime, device\n\n\ndef simctl(*args):\n    # The workflow setup/cleanup deadlines own this bound. On a slow hosted\n\
        \    # image, even listing devices has taken over three minutes; do not impose\n    # a second, shorter per-command\
        \ timeout or retry the operation.\n    return subprocess.run([\"xcrun\", \"simctl\", *args], check=True, capture_output=True,\n\
        \                          text=True).stdout\n\n\ndef owner_identity():\n    owner = {key: os.environ[key] for key\
        \ in\n             (\"GITHUB_REPOSITORY\", \"GITHUB_RUN_ID\", \"GITHUB_RUN_ATTEMPT\", \"GITHUB_JOB\", \"TEST_SHARD\"\
        , \"DEVELOPER_DIR\")}\n    if (not re.fullmatch(r\"[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+\", owner[\"GITHUB_REPOSITORY\"\
        ])\n            or any(not re.fullmatch(r\"[0-9]+\", owner[key]) for key in (\"GITHUB_RUN_ID\", \"GITHUB_RUN_ATTEMPT\"\
        ))\n            or any(not re.fullmatch(r\"[A-Za-z0-9_-]+\", owner[key]) for key in (\"GITHUB_JOB\", \"TEST_SHARD\"\
        ))\n            or not Path(owner[\"DEVELOPER_DIR\"]).is_absolute() or \"\\n\" in owner[\"DEVELOPER_DIR\"]):\n   \
        \     raise ValueError(\"Invalid CI owner identity\")\n    return owner\n\n\ndef runtime_identity(identifier):\n \
        \   matches = [r for r in json.loads(simctl(\"list\", \"runtimes\", \"-j\"))[\"runtimes\"]\n               if r.get(\"\
        identifier\") == identifier]\n    # Do not let an identical runtime identifier conceal different installed builds.\n\
        \    if len(matches) != 1 or matches[0].get(\"isAvailable\") is not True:\n        raise ValueError(\"Chosen runtime\
        \ is unavailable or ambiguously resolves to installed builds\")\n    row = matches[0]\n    keys = (\"identifier\"\
        , \"version\", \"buildversion\", \"bundlePath\")\n    if any(not isinstance(row.get(key), str) or not row[key].strip()\
        \ for key in keys):\n        raise ValueError(\"Chosen runtime lacks exact version/build/bundle identity\")\n    return\
        \ {key: row[key] for key in keys}\n\n\ndef owned_name(owner, nonce):\n    UUID(nonce)\n    return f\"RITC-CI-{owner['GITHUB_RUN_ID']}-{owner['GITHUB_RUN_ATTEMPT']}-{owner['GITHUB_JOB']}-{owner['TEST_SHARD']}-{nonce}\"\
        \n\n\ndef save_receipt(path, receipt):\n    # Replace our receipt atomically; never follow a receipt symlink on writes.\n\
        \    temporary = path.with_name(path.name + \".tmp\")\n    with temporary.open(\"x\", encoding=\"utf-8\") as output:\n\
        \        json.dump(receipt, output, indent=2)\n        output.write(\"\\n\")\n    temporary.replace(path)\n\n\ndef\
        \ current_owned_device(receipt):\n    if runtime_identity(receipt[\"runtime\"][\"identifier\"]) != receipt[\"runtime\"\
        ]:\n        raise ValueError(\"Chosen runtime identity changed\")\n    matches = [(runtime, device) for runtime, devices\
        \ in json.loads(simctl(\"list\", \"devices\", \"-j\"))[\"devices\"].items()\n               for device in devices\
        \ if device.get(\"udid\") == receipt[\"createdUDID\"]]\n    if not matches:\n        return None\n    if len(matches)\
        \ != 1:\n        raise ValueError(\"Created device UUID is ambiguous\")\n    runtime, device = matches[0]\n    if\
        \ (runtime != receipt[\"runtime\"][\"identifier\"] or device.get(\"name\") != receipt[\"createdName\"]\n         \
        \   or device.get(\"deviceTypeIdentifier\") != receipt[\"deviceTypeIdentifier\"]\n            or device.get(\"isAvailable\"\
        ) is not True):\n        raise ValueError(\"Current device does not match the owned name/type/runtime\")\n    return\
        \ device\n\n\ndef provision(devices, path):\n    if path.exists() or path.is_symlink():\n        raise ValueError(\"\
        Refusing to replace an existing simulator ownership receipt\")\n    runtime, source = select_iphone(devices, os.environ.get('CI_IPHONE_RUNTIME'),\
        \ os.environ.get('CI_IPHONE_NAME'))\n    owner = owner_identity()\n    source_id = str(UUID(source[\"udid\"])).upper()\n\
        \    device_type = source.get(\"deviceTypeIdentifier\")\n    if not isinstance(device_type, str) or not re.fullmatch(r\"\
        com\\.apple\\.CoreSimulator\\.SimDeviceType\\.[A-Za-z0-9-]+\", device_type):\n        raise ValueError(\"Selected\
        \ image device lacks an exact device type identifier\")\n    nonce = str(uuid4())\n    receipt = {\"schema\": 1, \"\
        owner\": owner, \"sourceUDID\": source_id, \"sourceName\": source[\"name\"],\n               \"deviceTypeIdentifier\"\
        : device_type, \"runtime\": runtime_identity(runtime), \"nonce\": nonce,\n               \"createdName\": owned_name(owner,\
        \ nonce), \"createdUDID\": None,\n               \"creationStatus\": \"pending\", \"cleanup\": {\"status\": \"not-run\"\
        }}\n    path.parent.mkdir(parents=True, exist_ok=True)\n    save_receipt(path, receipt)\n    try:\n        bundle\
        \ = Path(receipt[\"runtime\"][\"bundlePath\"])\n        root = bundle / \"Contents/Resources/RuntimeRoot\"\n     \
        \   receipt[\"runtimeFilesystem\"] = {\"bundle\": str(bundle), \"bundleExists\": bundle.is_dir(),\n              \
        \                          \"runtimeRoot\": str(root), \"runtimeRootExists\": root.is_dir(),\n                   \
        \                     \"rootSymlink\": root.is_symlink()}\n        receipt[\"creationRuntimeArgument\"] = str(bundle)\n\
        \        save_receipt(path, receipt)\n        if not (bundle.is_dir() and root.is_dir()):\n            raise ValueError(\"\
        Exact imported runtime bundle/root unavailable\")\n        created = str(UUID(simctl(\"create\", receipt[\"createdName\"\
        ], device_type, str(bundle)).strip())).upper()\n        if any(device.get(\"udid\", \"\").upper() == created for rows\
        \ in devices.values() for device in rows):\n            raise ValueError(\"Creation returned a device already present\
        \ in the input inventory\")\n        receipt.update(createdUDID=created, creationStatus=\"created\")\n        save_receipt(path,\
        \ receipt)\n        device = current_owned_device(receipt)\n        if device is None or device.get(\"state\") !=\
        \ \"Shutdown\":\n            raise ValueError(\"Fresh device was not found in Shutdown state\")\n        receipt[\"\
        creationStatus\"] = \"verified\"\n        save_receipt(path, receipt)\n        publish(created, receipt[\"createdName\"\
        ])\n        return receipt\n    except (KeyError, ValueError, OSError, subprocess.SubprocessError) as error:\n   \
        \     receipt[\"creationStatus\"] = \"failed\"\n        receipt[\"creationError\"] = str(error)\n        if isinstance(error,\
        \ subprocess.CalledProcessError) and error.stderr:\n            receipt[\"creationStderr\"] = error.stderr[-16384:]\n\
        \        save_receipt(path, receipt)\n        raise\n\n\ndef cleanup(path):\n    if not path.exists() and not path.is_symlink():\n\
        \        print(\"No simulator ownership receipt; no device cleanup attempted.\")\n        return\n    if path.is_symlink()\
        \ or not path.is_file() or path.stat().st_size > 65536:\n        raise ValueError(\"Refusing an invalid simulator\
        \ ownership receipt\")\n    receipt = json.loads(path.read_text(encoding=\"utf-8\"))\n    # Verify ownership before\
        \ recording anything or issuing a simulator mutation.\n    if receipt.get(\"schema\") != 1 or receipt.get(\"owner\"\
        ) != owner_identity():\n        raise ValueError(\"Simulator receipt belongs to another CI owner or toolchain\")\n\
        \    if receipt.get(\"createdName\") != owned_name(receipt[\"owner\"], receipt[\"nonce\"]):\n        raise ValueError(\"\
        Simulator receipt has an invalid owned device name\")\n    created = receipt.get(\"createdUDID\")\n    if created\
        \ is None:\n        receipt[\"cleanup\"] = {\"status\": \"no-created-device\", \"note\": \"No verified creation UUID;\
        \ no device mutation attempted.\"}\n        save_receipt(path, receipt)\n        return\n    if str(UUID(created)).upper()\
        \ != created or created == str(UUID(receipt[\"sourceUDID\"])).upper():\n        raise ValueError(\"Refusing to clean\
        \ up the source image device or invalid UUID\")\n    if os.environ.get(\"SIMULATOR_ID\", created) != created:\n  \
        \      raise ValueError(\"Current simulator environment does not match the owned UUID\")\n    receipt[\"cleanup\"\
        ] = {\"status\": \"checking\"}\n    save_receipt(path, receipt)\n    try:\n        device = current_owned_device(receipt)\n\
        \        if device is not None:\n            if device.get(\"state\") == \"Booted\":\n                receipt[\"cleanup\"\
        ][\"status\"] = \"shutting-down\"\n                save_receipt(path, receipt)\n                simctl(\"shutdown\"\
        , created)\n                device = current_owned_device(receipt)\n            if device is None or device.get(\"\
        state\") != \"Shutdown\":\n                raise ValueError(\"Owned device is not safely shut down; refusing deletion\"\
        )\n            receipt[\"cleanup\"][\"status\"] = \"deleting\"\n            save_receipt(path, receipt)\n        \
        \    simctl(\"delete\", created)\n            if current_owned_device(receipt) is not None:\n                raise\
        \ ValueError(\"Owned device remains after deletion\")\n            receipt[\"cleanup\"] = {\"status\": \"deleted\"\
        }\n        else:\n            receipt[\"cleanup\"] = {\"status\": \"already-absent\"}\n        save_receipt(path,\
        \ receipt)\n        print(\"Owned CI simulator cleanup: \" + receipt[\"cleanup\"][\"status\"])\n    except (KeyError,\
        \ ValueError, OSError, subprocess.SubprocessError) as error:\n        receipt[\"cleanup\"] = {\"status\": \"failed\"\
        , \"error\": str(error)}\n        save_receipt(path, receipt)\n        raise\n\n\ndef publish(udid, name):\n    print(f\"\
        Using {name} simulator ({udid})\")\n    with open(os.environ[\"GITHUB_ENV\"], \"a\") as output:\n        output.write(f\"\
        SIMULATOR_ID={udid}\\n\")\n\n\ndef main():\n    parser = argparse.ArgumentParser(description=__doc__)\n    mode =\
        \ parser.add_mutually_exclusive_group()\n    mode.add_argument(\"--create-owned\", type=Path, metavar=\"RECEIPT\"\
        )\n    mode.add_argument(\"--cleanup-owned\", type=Path, metavar=\"RECEIPT\")\n    args = parser.parse_args()\n  \
        \  try:\n        if args.cleanup_owned:\n            cleanup(args.cleanup_owned)\n        else:\n            devices\
        \ = json.load(sys.stdin)[\"devices\"]\n            if args.create_owned:\n                provision(devices, args.create_owned)\n\
        \            else:\n                _, device = select_iphone(devices, os.environ.get('CI_IPHONE_RUNTIME'), os.environ.get('CI_IPHONE_NAME'))\n\
        \                publish(device[\"udid\"], device[\"name\"])\n    except (KeyError, ValueError, OSError, subprocess.SubprocessError)\
        \ as error:\n        parser.exit(1, f\"Simulator selection/ownership failed: {error}\\n\")\n\n\nif __name__ == \"\
        __main__\":\n    main()\nRITC_OWNERSHIP_HELPER\nprintf '%s  %s\\n' 'e6123dd7149ad9aadf60603f77d7817b563c5bcffae9fb77b89875b6876a1737'\
        \ '.build/select_ci_iphone.py' | shasum -a 256 -c -\nxcrun simctl list -j > .build/test-before-create.json\nxcrun\
        \ simctl list devices available -j | python3 .build/select_ci_iphone.py --create-owned .build/test-simulator-ownership.json\n"
    - name: Boot the owned iPhone
      timeout-minutes: 8
      run: python3 scripts/boot_ios_simulator.py "$SIMULATOR_ID"
    - name: Run original produce journey with unchanged native checks
      timeout-minutes: 40
      run: bash scripts/run_ios_test_shard.sh
    - name: Require stable runtime identity even after native failure
      if: always() && steps.imported-runtime.outcome == 'success'
      timeout-minutes: 2
      run: python3 .build/prepare_github_ios_runtime.py verify
    - name: Reject any native retry or runner restart
      if: always() && steps.imported-runtime.outcome == 'success'
      shell: python
      run: 'from pathlib import Path

        assert not Path(''.build/Tests-retry.log'').exists(), ''Native retry is not accepted''

        log = Path(''.build/Tests.log'')

        assert log.is_file(), ''Native test log is required''

        assert ''Restarting after unexpected exit'' not in log.read_text(), ''Runner restart is not accepted''

        '
    - name: Retain runtime state and cleanup trace
      if: always()
      timeout-minutes: 3
      run: 'mkdir -p .build/github-ios-runtime

        xcrun simctl runtime list -j > .build/github-ios-runtime/final.json || true

        /usr/bin/log show --style compact --last 2h --predicate ''process == "simdiskimaged" OR process == "CoreSimulatorService"''
        > .build/github-ios-runtime/runtime-events.log 2>&1 || true

        xcrun simctl list -j > .build/test-final-inventory.json || true

        '
    - name: Clean up only the owned simulator
      if: always()
      timeout-minutes: 2
      run: python3 scripts/select_ci_iphone.py --cleanup-owned .build/test-simulator-ownership.json
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: ios27-direct-dmg-produce-${{ github.run_attempt }}
        include-hidden-files: true
        retention-days: 7
        path: '.build/github-ios-runtime

          .build/prepare_github_ios_runtime.py

          .build/Tests*

          .build/test-plan

          .build/test-*.json


          .build/select_ci_iphone.py

          '
'on':
  workflow_dispatch: null
