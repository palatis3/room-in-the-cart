name: Comparison accessibility diagnosis on Bitrise A1
on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact diagnostic branch commit
        required: true
        type: string

permissions:
  contents: read

jobs:
  compare:
    if: github.ref == 'refs/heads/codex/pr61-audit-hosted'
    runs-on: bitrise-runner-A1
    timeout-minutes: 40
    env:
      DEVELOPER_DIR: /Applications/Xcode-27.1.0.app/Contents/Developer
      CI_IPHONE_RUNTIME: com.apple.CoreSimulator.SimRuntime.iOS-27-0
      CI_IPHONE_NAME: iPhone 17
      TEST_SHARD: comparison-audit
      EXPECTED_TEST_COUNT: '1'
      EXPECTED_SHA: ${{ inputs.candidate_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Verify the source, toolchain and runner
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$EXPECTED_SHA" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(uname -m)" = arm64
          test "$(xcodebuild -version)" = $'Xcode 27.1\nBuild version 27A9275'
          mkdir -p .build/test-plan
          python3 - <<'PY'
          import os, sys
          sys.path.insert(0, 'scripts')
          from select_ci_iphone import runtime_identity
          runtime = runtime_identity(os.environ['CI_IPHONE_RUNTIME'])
          assert (runtime['version'], runtime['buildversion']) == ('27.0', '24A434'), runtime
          PY
          xcrun simctl list devices available -j | python3 scripts/select_ci_iphone.py
          echo 'RoomInTheCartUITests/RoomInTheCartUITests/testAutomatedAccessibilityAuditOnShopAndKnownResults' > .build/test-plan/comparison-audit.txt
      - name: Activate the standard compilation cache
        continue-on-error: true
        run: bash scripts/activate_bitrise_xcode_cache.sh
      - name: Build the isolated probe and boot the simulator
        timeout-minutes: 20
        run: |
          set -euo pipefail
          python3 scripts/boot_ios_simulator.py "$SIMULATOR_ID" > .build/boot.log 2>&1 &
          boot_pid=$!
          xcodebuild -project ios/RoomInTheCart.xcodeproj -scheme RoomInTheCart -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" -derivedDataPath .build/DerivedData \
            -jobs 4 ONLY_ACTIVE_ARCH=YES CODE_SIGN_IDENTITY=- build-for-testing > .build/Build.log 2>&1
          wait "$boot_pid"
      - name: Execute the existing audits and supplemental controls
        run: bash scripts/run_ios_test_shard.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: comparison-audit-A1-${{ github.run_attempt }}
          path: |
            .build/Build.log
            .build/boot.log
            .build/Tests*.log
            .build/Tests*.xcresult
            .build/test-plan
            .build/test-*.json
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error
