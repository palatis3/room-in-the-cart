name: Swift PhotosPicker overlay diagnostic

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact 40-character SHA of this isolated diagnostic workflow ref
        type: string
        required: true

permissions:
  contents: read

jobs:
  photos-overlay:
    runs-on: macos-15
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      EXPECTED_SHA: ${{ inputs.candidate_sha }}
      EVENT_SHA: ${{ github.sha }}
      EVIDENCE: ${{ github.workspace }}/.build/photos-overlay-diagnostic
      CODEQL_DIR: ${{ github.workspace }}/.build/photos-overlay-codeql/codeql
    steps:
      - name: Require immutable diagnostic identity
        shell: bash
        run: |
          python3 - <<'PY'
          import os,re
          assert re.fullmatch('[0-9a-f]{40}',os.environ['EXPECTED_SHA'])
          assert os.environ['EXPECTED_SHA']==os.environ['EVENT_SHA']
          PY
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.EXPECTED_SHA }}
          persist-credentials: false
      - name: Freeze exact fixture, query and toolchain
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,os,shutil,subprocess

          root=Path(os.environ['EVIDENCE'])
          root.mkdir(parents=True)
          (root/'source').mkdir()
          (root/'queries').mkdir()
          assets=Path('scripts/diagnostics/photos-overlay')
          inputs={
              assets/'PhotoProbe.swift': root/'source/PhotoProbe.swift',
              assets/'Probe.ql': root/'queries/Probe.ql',
              assets/'qlpack.yml': root/'queries/qlpack.yml',
              assets/'compile.sh': root/'compile.sh',
              Path('scripts/diagnostics/photos_overlay_probe.py'): root/'run.py',
              Path('.github/workflows/ios-toggle-diagnostic.yml'): root/'workflow.yml',
          }
          for source,destination in inputs.items():
              shutil.copy2(source,destination)
          expected='5c3292c77777137361bbccafd993bdac13a39cd94f4ed3037b05a295d381c726'
          assert hashlib.sha256((root/'source/PhotoProbe.swift').read_bytes()).hexdigest()==expected
          actual=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          assert actual==os.environ['EXPECTED_SHA']
          xcode=subprocess.check_output(['xcodebuild','-version'],text=True).strip()
          swift=subprocess.check_output(['xcrun','swiftc','--version'],stderr=subprocess.STDOUT,text=True).strip()
          sdk=subprocess.check_output(['xcrun','--sdk','iphoneos','--show-sdk-version'],text=True).strip()
          (root/'toolchain.json').write_text(json.dumps({
              'candidate':actual,'xcode':xcode,'swift':swift,'sdk':sdk,
              'host':subprocess.check_output(['uname','-m'],text=True).strip(),
          },indent=2))
          assert xcode=='Xcode 26.3\nBuild version 17C529',xcode
          assert 'Swift version 6.2.4' in swift,swift
          assert sdk=='26.2',sdk
          (root/'input-sha256.json').write_text(json.dumps({
              str(source):hashlib.sha256(source.read_bytes()).hexdigest()
              for source in inputs
          },indent=2))
          PY
      - name: Fetch and verify pinned official Swift tooling
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          tool_root="$(dirname "$CODEQL_DIR")"
          mkdir -p "$tool_root"
          archive="$tool_root/codeql-bundle-swift-osx64.tar.zst"
          curl --fail --location --proto '=https' --tlsv1.2 --max-time 75 \
            'https://github.com/github/codeql-action/releases/download/codeql-bundle-v2.27.4/codeql-bundle-swift-osx64.tar.zst' -o "$archive"
          printf '%s  %s\n' '52e3f0ea756787f0ceb2e5b2553d2560ba1d83573e3f77002f31833b307fbebc' "$archive" | shasum -a 256 -c - | tee "$EVIDENCE/bundle-verification.log"
          test "$(stat -f %z "$archive")" = 392800211
          tar -xf "$archive" -C "$tool_root"
          "$CODEQL_DIR/codeql" version --format=json > "$EVIDENCE/codeql-version.json"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          assert json.loads((Path(os.environ['EVIDENCE'])/'codeql-version.json').read_text())['version']=='2.27.4'
          PY
          shasum -a 256 "$CODEQL_DIR/swift/tools/osx64/extractor.real" > "$EVIDENCE/extractor-sha256.txt"
          file "$CODEQL_DIR/swift/tools/osx64/extractor.real" > "$EVIDENCE/extractor-architecture.txt"
      - name: Compare independent baseline and overlay-enabled extraction
        timeout-minutes: 11
        shell: bash
        run: python3 "$EVIDENCE/run.py"
      - name: Retain both outcomes including incomplete trials
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: swift-photos-overlay-${{ github.run_attempt }}
          path: |
            .build/photos-overlay-diagnostic/
            !.build/photos-overlay-diagnostic/*/database/**
            !.build/photos-overlay-diagnostic/*/module-cache/**
            !.build/photos-overlay-diagnostic/*/*.o
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: warn
