name: UI07 keyboard dismissal diagnostic

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact reviewed diagnostic commit; never release acceptance
        required: true
        type: string
permissions:
  contents: read
env:
  DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
  EXPECTED_SHA: ${{ inputs.expected_sha }}
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  keyboard-build:
    name: Build exact keyboard diagnostic products
    runs-on: macos-15
    timeout-minutes: 35
    concurrency:
      group: ritc-macos-slot-2
      queue: max
      cancel-in-progress: false
    env:
      KEYBOARD_STATE: .build/keyboard-build
      KEYBOARD_ROLE: build
    outputs:
      artifact: ${{ steps.products.outputs.artifact-id }}
      sha256: ${{ steps.freeze.outputs.sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact source and create owned build simulator
        timeout-minutes: 8
        run: python3 diagnostics/keyboard-dismiss/hosted/harness.py prepare
      - name: Boot and verify exact build runtime
        timeout-minutes: 8
        run: python3 diagnostics/keyboard-dismiss/hosted/harness.py boot
      - name: Build ordinary Debug plus diagnostic flag
        run: python3 diagnostics/keyboard-dismiss/hosted/harness.py build
      - name: Verify compiled inventory and freeze transport
        id: freeze
        run: python3 diagnostics/keyboard-dismiss/hosted/harness.py freeze
      - name: Clean only owned build resources and record outcomes
        if: always()
        timeout-minutes: 3
        run: python3 diagnostics/keyboard-dismiss/hosted/harness.py cleanup
      - name: Retain frozen diagnostic binaries separately
        if: always()
        id: products
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: keyboard-products-${{ github.run_attempt }}
          path: ${{ runner.temp }}/keyboard-products.tar.gz
          compression-level: 0
          retention-days: 7
          if-no-files-found: ignore
      - name: Retain build proof and cleanup outcomes
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: keyboard-build-evidence-${{ github.run_attempt }}
          path: .build/keyboard-build/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error

  keyboard-run:
    name: Original six-case ordinary UI07 history with keyboard events
    needs: keyboard-build
    runs-on: macos-15
    timeout-minutes: 55
    concurrency:
      group: ritc-macos-slot-2
      queue: max
      cancel-in-progress: false
    env:
      KEYBOARD_STATE: .build/keyboard-run
      KEYBOARD_ROLE: run
      BUILD_PRODUCT_SHA256: ${{ needs.keyboard-build.outputs.sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact source and create separate owned execution simulator
        timeout-minutes: 8
        run: python3 diagnostics/keyboard-dismiss/hosted/harness.py prepare
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ needs.keyboard-build.outputs.artifact }}
          path: .build/download
          merge-multiple: true
      - name: Verify frozen products and unchanged original xctestrun
        run: python3 diagnostics/keyboard-dismiss/hosted/harness.py restore
      - name: Boot and verify exact execution runtime
        timeout-minutes: 8
        run: python3 diagnostics/keyboard-dismiss/hosted/harness.py boot
      - name: Execute the original six selectors once
        timeout-minutes: 40
        run: python3 diagnostics/keyboard-dismiss/hosted/harness.py execute
      - name: Retain bounded filtered logs and apply unchanged strict checker
        if: always()
        timeout-minutes: 6
        run: python3 diagnostics/keyboard-dismiss/hosted/harness.py collect
      - name: Clean only owned execution resources and record outcomes
        if: always()
        timeout-minutes: 3
        run: python3 diagnostics/keyboard-dismiss/hosted/harness.py cleanup
      - name: Retain diagnostic evidence including cleanup
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: keyboard-run-evidence-${{ github.run_attempt }}
          path: .build/keyboard-run/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error
