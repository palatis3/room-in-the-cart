name: Spanish Done event diagnostic

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact diagnostic branch commit SHA; must match the selected workflow ref
        type: string
        required: true

permissions:
  contents: read

jobs:
  spanish-done:
    runs-on: macos-15
    timeout-minutes: 70
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      EXPECTED_SHA: ${{ inputs.expected_sha }}
      EVENT_SHA: ${{ github.sha }}
    steps:
      - name: Require one exact manually selected diagnostic commit
        run: |
          python3 - <<'PY'
          import os, re
          value = os.environ['EXPECTED_SHA']
          if not re.fullmatch('[0-9a-f]{40}', value) or value != os.environ['EVENT_SHA']:
              raise SystemExit('The exact expected SHA must equal the selected workflow ref')
          if os.environ['GITHUB_RUN_ATTEMPT'] != '1':
              raise SystemExit('No diagnostic workflow retry')
          PY
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate diagnostic parsing and source preservation without native UI actions
        run: |
          python3 -m unittest discover -s diagnostics/spanish-done -p 'test_*.py'
          bash -n diagnostics/spanish-done/build.sh
          bash -n diagnostics/spanish-done/local-wiring.sh
      - name: Check exact source and environment; create and boot one owned simulator
        timeout-minutes: 8
        run: python3 diagnostics/spanish-done/run.py prepare
      - name: Compile original core test profile and freeze diagnostic products
        timeout-minutes: 30
        run: bash diagnostics/spanish-done/build.sh
      - name: Run the complete original Spanish selector once with normal idling
        timeout-minutes: 21
        run: python3 diagnostics/spanish-done/run.py execute
      - name: Collect evidence and retain independent test and capture verdicts
        if: always()
        timeout-minutes: 8
        run: python3 diagnostics/spanish-done/run.py collect
      - name: Shut down only the owned simulator
        if: always()
        timeout-minutes: 3
        run: python3 diagnostics/spanish-done/run.py cleanup
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: spanish-done-diagnostic-${{ github.run_attempt }}
          path: .build/spanish-done/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error
