name: iOS fixture checks

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact reviewed diagnostic commit; never release acceptance
        required: true
        type: string
permissions:
  contents: read
env:
  DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
  EXPECTED_SHA: ${{ inputs.expected_sha }}
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  consent-build:
    name: Build exact consent diagnostic products
    runs-on: macos-15
    timeout-minutes: 35
    concurrency:
      group: ritc-macos-slot-0
      queue: max
      cancel-in-progress: false
    env:
      CONSENT_STATE: .build/consent-build
      CONSENT_ROLE: build
    outputs:
      artifact: ${{ steps.products.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact source and create owned build simulator
        timeout-minutes: 8
        run: python3 diagnostics/measurement-consent/hosted/harness.py prepare
      - name: Boot and verify exact build runtime
        timeout-minutes: 8
        run: python3 diagnostics/measurement-consent/hosted/harness.py boot
      - name: Build original contributor profile
        run: python3 diagnostics/measurement-consent/hosted/harness.py build
      - name: Verify compiled inventory and freeze transport
        run: python3 diagnostics/measurement-consent/hosted/harness.py freeze
      - name: Clean only owned build resources and record outcomes
        if: always()
        timeout-minutes: 3
        run: python3 diagnostics/measurement-consent/hosted/harness.py cleanup
      - name: Retain frozen diagnostic binaries separately
        if: always()
        id: products
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: consent-products-${{ github.run_attempt }}
          path: ${{ runner.temp }}/consent-products.tar.gz
          compression-level: 0
          retention-days: 7
          if-no-files-found: ignore
      - name: Retain build proof and cleanup outcomes
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: consent-build-evidence-${{ github.run_attempt }}
          path: .build/consent-build/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error

  consent-run:
    name: Original seven-case contributor history with consent events
    needs: consent-build
    runs-on: macos-15
    timeout-minutes: 55
    concurrency:
      group: ritc-macos-slot-0
      queue: max
      cancel-in-progress: false
    env:
      CONSENT_STATE: .build/consent-run
      CONSENT_ROLE: run
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact source and create separate owned execution simulator
        timeout-minutes: 8
        run: python3 diagnostics/measurement-consent/hosted/harness.py prepare
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ needs.consent-build.outputs.artifact }}
          path: .build/download
          merge-multiple: true
      - name: Verify frozen products and sibling xctestrun copy
        run: python3 diagnostics/measurement-consent/hosted/harness.py restore
      - name: Boot and verify exact execution runtime
        timeout-minutes: 8
        run: python3 diagnostics/measurement-consent/hosted/harness.py boot
      - name: Execute the original seven selectors once
        timeout-minutes: 40
        run: python3 diagnostics/measurement-consent/hosted/harness.py execute
      - name: Retain bounded filtered logs and apply unchanged strict checker
        if: always()
        timeout-minutes: 6
        run: python3 diagnostics/measurement-consent/hosted/harness.py collect
      - name: Clean only owned execution resources and record outcomes
        if: always()
        timeout-minutes: 3
        run: python3 diagnostics/measurement-consent/hosted/harness.py cleanup
      - name: Retain diagnostic evidence including cleanup
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: consent-run-evidence-${{ github.run_attempt }}
          path: .build/consent-run/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error
