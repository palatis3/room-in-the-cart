name: Swift security resource observation
on:
  push:
    branches: [codex/swift-codeql-resource-observation]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: swift-resource-observation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ios-swift-codeql:
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
      actions: read
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Record Swift analysis toolchain
        shell: bash
        run: |
          mkdir -p .build
          {
            uname -m
            xcodebuild -version
            swift --version
          } | tee .build/SwiftCodeQLToolchain.log
      - name: Validate Release Swift settings before tracing
        shell: bash
        run: |
          # GitHub's Swift extraction guidance requires uncached compilation and the legacy driver.
          # https://docs.github.com/en/code-security/tutorials/customize-code-scanning/prepare-code-for-analysis
          build_args=(
            -project ios/RoomInTheCart.xcodeproj -scheme RoomInTheCart-Release
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS'
            -jobs 2 -derivedDataPath .build/SwiftCodeQLDerivedData ARCHS=arm64
            CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
            COMPILATION_CACHE_ENABLE_CACHING=NO SWIFT_ENABLE_COMPILE_CACHE=NO
            SWIFT_USE_INTEGRATED_DRIVER=NO SWIFT_OPTIMIZATION_LEVEL=-Onone
          )
          cat > .build/SwiftCodeQLAssertUncompiled.py <<'PY'
          from pathlib import Path
          import json
          import re
          import stat

          # Settings resolution may write PIF JSON, but must not compile runtime sources.
          # Fail closed on other DerivedData/Build files, even if their suffix is unknown.
          derived_build = Path(".build/SwiftCodeQLDerivedData/Build")
          roots = [derived_build, *Path("ios/Packages").glob("*/.build")]
          product_suffixes = {
              ".o", ".obj", ".a", ".dylib", ".so", ".dll", ".swiftmodule", ".swiftdoc",
              ".swiftinterface", ".swiftsourceinfo", ".pcm", ".bc", ".air", ".metallib", ".ipa",
          }
          product_directories = {".app", ".appex", ".framework", ".xcframework", ".xcarchive", ".dSYM", ".bundle", ".swiftmodule"}
          binary_magic = (
              b"\xfe\xed\xfa\xce", b"\xce\xfa\xed\xfe", b"\xfe\xed\xfa\xcf", b"\xcf\xfa\xed\xfe",
              b"\xca\xfe\xba\xbe", b"\xbe\xba\xfe\xca", b"\xca\xfe\xba\xbf", b"\xbf\xba\xfe\xca",
              b"\x7fELF", b"MZ", b"!<arch>\n", b"BC\xc0\xde", b"\xde\xc0\x17\x0b",
          )
          pif_names = {"project": "(?:PROJECT|PACKAGE)", "target": "TARGET", "workspace": "WORKSPACE"}


          def planning_metadata(path):
              parts = path.relative_to(derived_build).parts
              if len(parts) != 5 or parts[:3] != ("Intermediates.noindex", "XCBuildData", "PIFCache"):
                  return False
              prefix = pif_names.get(parts[3])
              if prefix is None or re.fullmatch(prefix + r"@v[0-9]+_.+-json", parts[4]) is None:
                  return False
              try:
                  return isinstance(json.loads(path.read_text(encoding="utf-8")), dict)
              except (OSError, UnicodeError, json.JSONDecodeError):
                  return False


          found = []
          for root in roots:
              if root.is_symlink():
                  found.append(str(root) + " [symlink]")
                  continue
              if not root.exists():
                  continue
              for path in root.rglob("*"):
                  mode = path.lstat().st_mode
                  reason = None
                  if stat.S_ISLNK(mode):
                      reason = "symlink"
                  elif stat.S_ISDIR(mode):
                      if path.suffix in product_directories:
                          reason = "product bundle"
                  elif not stat.S_ISREG(mode):
                      reason = "non-regular output"
                  elif path.suffix in product_suffixes:
                      reason = "compiled product suffix"
                  elif mode & 0o111:
                      reason = "executable output"
                  else:
                      with path.open("rb") as stream:
                          header = stream.read(8)
                      if header.startswith(binary_magic):
                          reason = "compiled binary header"
                      elif root == derived_build and not planning_metadata(path):
                          reason = "unrecognized Build output"
                  if reason:
                      found.append(str(path) + " [" + reason + "]")
          if found:
              raise SystemExit("Swift CodeQL requires uncompiled app/package sources; found: " + ", ".join(sorted(found)[:20]))
          print("No pre-existing app/package compiled products; permitted only recognized PIF JSON in DerivedData/Build.")
          PY
          python3 .build/SwiftCodeQLAssertUncompiled.py
          settings="$RUNNER_TEMP/swift-codeql-settings.json"
          xcodebuild "${build_args[@]}" -showBuildSettings -json > "$settings" 2> .build/SwiftCodeQLSettings.stderr.log
          python3 - "$settings" <<'PY' | tee .build/SwiftCodeQLSettings.log
          import json, sys
          from pathlib import Path

          targets = json.loads(Path(sys.argv[1]).read_text())
          app = [target["buildSettings"] for target in targets if target.get("target") == "RoomInTheCart"]
          if len(app) != 1:
              raise SystemExit("Expected exactly one RoomInTheCart app target in Xcode build settings.")
          expected = {"CONFIGURATION": "Release", "PLATFORM_NAME": "iphoneos", "ARCHS": "arm64", "SWIFT_OPTIMIZATION_LEVEL": "-Onone"}
          actual = {key: app[0].get(key) for key in expected}
          conditions = app[0].get("SWIFT_ACTIVE_COMPILATION_CONDITIONS", "").split()
          print(json.dumps({**actual, "SWIFT_ACTIVE_COMPILATION_CONDITIONS": conditions}, indent=2))
          if actual != expected or "RELEASE" not in conditions or "DEBUG" in conditions:
              raise SystemExit("Swift CodeQL must compile Release sources for arm64 iPhoneOS with optimization disabled.")
          PY
          python3 .build/SwiftCodeQLAssertUncompiled.py
          declare -p build_args > .build/SwiftCodeQLBuildArgs.sh
      - name: Initialize Swift security analysis
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: swift
          build-mode: manual
          debug: true
      - name: Compile Release Swift sources for CodeQL
        timeout-minutes: 30
        shell: bash
        run: |
          # Prospective body of the existing 30-minute compile step; not installed.
          # The existing GitHub Bash shell retains -e -o pipefail.
          source .build/SwiftCodeQLBuildArgs.sh
          python3 .build/SwiftCodeQLAssertUncompiled.py

          sampler_pid=''
          sampler_control_dir=''
          sampler_running() {
            local running_pid running_jobs
            running_jobs="$(jobs -pr)" || return 2
            for running_pid in $running_jobs; do
              if [[ "$running_pid" == "$sampler_pid" ]]; then
                return 0
              fi
            done
            return 1
          }
          stop_sampler() {
            local attempt running_status
            # A private control file requests shutdown; no PID is signalled, eliminating
            # the risk of signalling an unrelated process after PID reuse.
            if [[ -n "$sampler_control_dir" ]]; then
              { : > "$sampler_control_dir/stop"; } 2>/dev/null || :
            fi
            if [[ -n "$sampler_pid" ]]; then
              for attempt in {1..15}; do
                if sampler_running; then
                  # Nominal polling only: this external sleep can itself be traced.
                  sleep 0.2 || break
                else
                  running_status=$?
                  # Unknown job-table state must not trigger a potentially blocking wait.
                  if [[ "$running_status" != 1 ]]; then
                    break
                  fi
                  wait "$sampler_pid" 2>/dev/null || printf '%s\n' resource_sampler_unavailable || :
                  sampler_pid=''
                  break
                fi
              done
              # After nominal polling, do not wait indefinitely for the sampler.
              # Traced process startup can delay sleep itself; this is not a hard 3s bound.
              # Parent exit is an independent shutdown condition inside the sampler.
              if [[ -n "$sampler_pid" ]]; then
                printf '%s\n' resource_sampler_stop_pending || :
              fi
            fi
          }
          finish_compile_step() {
            local build_status=$?
            trap - EXIT TERM INT HUP
            # Cleanup is diagnostic: even a future nonzero cleanup path must not
            # replace the captured build status under Bash errexit.
            stop_sampler || :
            exit "$build_status"
          }
          trap finish_compile_step EXIT
          trap 'exit 143' TERM
          trap 'exit 130' INT
          trap 'exit 129' HUP

          if sampler_control_dir="$(mktemp -d "$RUNNER_TEMP/swift-codeql-resources.XXXXXX" 2>/dev/null)"; then
            python3 scripts/sample_swift_resources.py \
              --output .build/SwiftCodeQLResources.jsonl \
              --parent-pid "$$" --stop-file "$sampler_control_dir/stop" \
              >/dev/null 2>&1 &
            sampler_pid=$!
          else
            printf '%s\n' resource_sampler_unavailable || :
          fi

          # Capture exactly the existing pipeline's status, including tee failure.
          # Neither collector startup nor shutdown may replace a failing build status.
          set +e
          xcodebuild "${build_args[@]}" build 2>&1 | tee .build/SwiftCodeQLBuild.log
          build_status=$?
          set -e
          exit "$build_status"
      - name: Analyze Swift security findings
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:swift
      - name: Retain Swift analysis compilation logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: iphone-swift-codeql-build-logs-${{ github.run_attempt }}
          path: |
            .build/SwiftCodeQLToolchain.log
            .build/SwiftCodeQLSettings.log
            .build/SwiftCodeQLSettings.stderr.log
            .build/SwiftCodeQLBuild.log
            .build/SwiftCodeQLResources.jsonl
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: ignore
